# Netlify configuration for Chel Gaming Hockey League
# Serverless functions (EA stats, Discord) + a static site whose single
# index.html is generated at deploy time from src/live/ (so git doesn't carry a ~700KB
# blob per edit). No dependencies — the build is a pure Node file concatenation (~1s).

[build]
  # v4.04: preview.html (the local design preview) is no longer built here; it was blocked at the edge anyway, and building
  # and uploading a second 2.6 MB copy of the app on every deploy cost Netlify usage for nothing. Build it locally with
  # node src/live/build.cjs preview.html preview_layer.js.
  command = "node src/live/build.cjs index.html"
  publish = "."
  functions = "netlify/functions"
  # v4.04 (commissioner: "maximize the efficiency of this project so I dont use up all of our netlify usage"): skip the
  # deploy when a push changes only database records, tools, docs or the VM bot's own files. Fail-safe: anything it
  # cannot be sure of builds. See tools/netlify-ignore.sh.
  ignore = "sh tools/netlify-ignore.sh"

# HTTPS_PROXY (the IPRoyal residential proxy that lets the EA functions reach proclubs.ea.com from
# Netlify's blocked datacenter IPs) is configured in the site's env vars with the "builds" scope on,
# so npm ALSO tried to reach registry.npmjs.org through it. When the proxy lapsed on 2026-09-05 every
# deploy died at "Install dependencies" with exit 1 — nothing in this repo had changed, and two
# commits sat unpublished while the site served a 2-hour-old edge copy. The build is a dependency-free
# file concatenation that needs no proxy, so blank it for the build only: npm goes direct, and the
# functions keep using the proxy from the site env vars at runtime.
[build.environment]
  HTTPS_PROXY = ""
  HTTP_PROXY = ""
  https_proxy = ""
  http_proxy = ""

# `publish = "."` serves the WHOLE repo root, which quietly made three things public that were
# never meant to be: preview.html (a full second copy of the live app, rebuilt every deploy and
# reachable by anyone who guesses the name), the internal owners' briefing with its paste
# instructions, and an abandoned homepage mockup. The mockup is deleted; the other two still need
# to EXIST — preview.html is a design build we open locally, the briefing is a working document —
# so they are blocked at the edge instead.
#
# These MUST be exact paths. Netlify only treats `*` as a TRAILING splat (/dir/*), never as an
# extension glob, so a "/*.txt" rule silently matches nothing — it was written that way first, the
# config looked right, the test passed, and the briefing stayed downloadable until a live curl
# caught it. Adding a file to the root that should not be public means adding a line here.
# The supabase client is parser-blocking and its VERSION is in the filename, so a bump changes
# the URL — it can be cached forever and never revalidated.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/preview.html"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/CGHL-Season1-Owners-Briefing-DISCORD.txt"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/CGHL-Season1-Owners-Briefing.md"
  to = "/index.html"
  status = 404
  force = true

[functions]
  # v4.06: src/live/part3_content.js is no longer shipped. discord-scheduler reads the #rules card from the database
  # (app_config.rules_card, copied from version.json), because on Supabase it cannot open repo files at all.
  # assets/role-icons/: fixed role artwork that has no source on the site — just STAFF.png, the
  # referee jersey. Club crests used to be pre-rendered here too, because Discord rejects the WebP
  # the site stores; they now render live through Supabase's image transformer, which returns PNG
  # and needs no decoding, so a new club or a re-brand reaches Discord without a commit. The glob
  # stays broad so another fixed mark can be dropped in without editing this file. These live
  # OUTSIDE netlify/functions/, because Netlify scans every subdirectory of that folder as a
  # function candidate — assets placed there are not shipped.
  included_files = ["assets/role-icons/*", "assets/role-icons/**"]

# The EA stats fetcher POSTs raw match data here (auth: x-ingest-key header).
[[redirects]]
  from = "/api/ingest-stats"
  to = "/.netlify/functions/ingest-stats"
  status = 200

# The request-reachable door to the Discord sweep (diag / register / setup / reconcile / run-now).
# The sweep itself is a scheduled job (jobs/discord-sync.js, on Supabase from v4.06); this door imports the same code.
[[redirects]]
  from = "/api/discord-ops"
  to = "/.netlify/functions/discord-ops"
  status = 200

# Discord interactions endpoint for the #lfg pickup bot (slash command + button/select callbacks).
# This URL goes in the Discord Developer Portal under "Interactions Endpoint URL".
[[redirects]]
  from = "/api/discord-interactions"
  to = "/.netlify/functions/discord-interactions"
  status = 200

# Pickup-game stats importer (search EASHL club -> pick a club_private match -> attach to profiles).
[[redirects]]
  from = "/api/pickup-import"
  to = "/.netlify/functions/pickup-import"
  status = 200

# `publish = "."` serves the repo root, which means the working tree is reachable on the public
# domain: /src/live/part_live.js (421 KB of raw source), /server.js, /package.json, both READMEs and
# the internal design standards all returned 200. Nothing is secret and nothing at runtime fetches
# them — the built index.html is fully self-contained — so they simply shouldn't be served.
# force = true is load-bearing: without it Netlify serves a file that exists on disk and never
# consults the rule, which is exactly what happened on the first attempt at this.
[[redirects]]
  from = "/src/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true
# shared/ is backend source (role rules shared by discord-sync and the gateway bot) — bundled into
# the function at build time, never something the public site should serve.
[[redirects]]
  from = "/shared/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/bot/*"
  to = "/"
  status = 404
  force = true
# v4.06: the scheduled jobs' source (jobs/), their Supabase wrapper (edge/) and the Supabase deploy settings (supabase/)
[[redirects]]
  from = "/jobs/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/edge/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/server.js"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/README*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE*"
  to = "/"
  status = 404
  force = true
# BRAND.md is working-doc source — the public face is the rendered page (/#/brand). Netlify only
# supports a trailing `*` or `:param` in `from`, so an extension glob like `/*.md` never matches;
# block the file by its prefix, the way README*/CLAUDE* are.
[[redirects]]
  from = "/BRAND*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/"
  status = 404
  force = true

# Fingerprint-free assets that change rarely. index.html deliberately stays uncached — it is
# regenerated on every deploy and carries the whole app, so a stale copy is the one thing we
# can't afford.
# v4.05: the build id the database reads every 10 minutes; never cached, so a new deploy is seen at once
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/json"
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=604800"

# Security headers for the static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # Inline JS/CSS need 'unsafe-inline'; the app also loads supabase-js (jsDelivr), Google Fonts, and
    # talks to Supabase over REST + realtime (wss). Images allow https (Discord avatars, Supabase logos).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://bzbuyclwdhmhdzujxeqd.supabase.co wss://bzbuyclwdhmhdzujxeqd.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'"
