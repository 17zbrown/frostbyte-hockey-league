# TEMPLATE (v4.06): copy this file to .github/workflows/edge-deploy.yml to switch on automatic deploys. It lives here
# because the push credential on the commissioner's Mac lacks GitHub's "workflow" permission, so a push that adds a
# workflow file is refused. Until it is installed, deploy by hand (supabase/config.toml has the command).
name: Deploy Supabase Edge jobs

# v4.06: discord-sync, twitch-live-sync, lfg-timers, discord-scheduler and discord-welcome run as Supabase Edge Functions,
# fired by pg_cron (sql/2026-10-14-edge-jobs-v406.sql). Supabase does not redeploy on a push the way Netlify does, so this
# does: any push to main that changes a file the bundles are built from rebuilds all five (tools/edge/build.mjs) and
# deploys them. The database watchdog pages when a deployed job's build differs from the one version.json expects, so a
# failed run here is noticed even if nobody reads this page.
#
# Required repo secret (Settings, Secrets and variables, Actions):
#   SUPABASE_ACCESS_TOKEN   a Supabase personal access token (supabase.com, Account, Access Tokens)
# Run it by hand from the Actions tab ("Run workflow") to redeploy without a code change, for example after changing an
# Edge Function secret in the Supabase dashboard.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "jobs/**"
      - "edge/**"
      - "shared/**"
      - "bot/club-notices.mjs"
      - "bot/handlers.mjs"
      - "assets/role-icons/**"
      - "tools/edge/**"
      - "supabase/config.toml"
      - ".github/workflows/edge-deploy.yml"
      - "tools/edge/edge-deploy.yml"

concurrency:
  group: edge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Supabase runs Deno; the bundle test loads every job in it before anything is deployed
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build the five bundles
        run: node tools/edge/build.mjs
      - name: Check the bundles and the wrapper
        env:
          REQUIRE_DENO: "1"
        run: |
          node tools/edge-bundles.test.mjs
          node tools/edge-wrapper.test.mjs
      - name: Deploy to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::The SUPABASE_ACCESS_TOKEN repo secret is missing, so nothing was deployed. Add it under Settings, Secrets and variables, Actions, then run this workflow again."
            exit 1
          fi
          npx --yes supabase@2.118.0 functions deploy discord-sync twitch-live-sync lfg-timers discord-scheduler discord-welcome \
            --project-ref bzbuyclwdhmhdzujxeqd --use-api
