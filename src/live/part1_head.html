<style>
/* ================================================================
   CHEL GAMING DESIGN SYSTEM — "FRESH SHEET"
   Palette (6): Ice #F5F6F2 · Paper #FFF · Jersey Ink #101519 ·
   Steel #5C6B75 · Chrome Yellow #FFE500 · Goal Red #C63A32 /
   Win Green #1F9D58 (semantic only).
   Type: Archivo (display/UI) · IBM Plex Sans (body) · IBM Plex Mono (data).
   ================================================================ */
:root{
  --ice:#F5F6F2; --paper:#FFFFFF; --ink:#101519; --ink-2:#1A2127; --ink-3:#242D34;
  --steel:#5C6B75; --steel-2:#5F6E78; --line:#E3E6DF; --line-soft:#EDEFE9;
  --chrome:#FFE500; --chrome-deep:#E5C900; --chrome-tint:#FFFBD6;
  --viz-accent:#A87E00;   /* chart accent that clears 3:1 on white paper; chrome is unreadable on light */
  /* the accent, deepened to hold on white — chrome yellow is ~1.07:1 on paper. Constant in both
     themes on purpose: it is the light-background logo colour and must not shift under the theme. */
  --gold:#D9A800;
  /* Semantic hues split in two: --red/--green are FILLS (light text sits on them, so they must stay
     dark in both themes); --*-ink are the TEXT/mark colors and flip per theme. Never use a fill token
     as a foreground — it cannot clear 4.5:1 on both a light and a dark surface at once. */
  --red:#C63A32; --red-tint:#FBEDEC; --red-ink:#B5342D;
  --green:#1F9D58; --green-tint:#EAF6EF; --green-ink:#177A44;
  --amber-ink:#8A6D00;
  --on-ink:#F2F4F0; --on-ink-dim:#9AA8B0;
  --bc:#101519; --bc2:#1A2127; --bc3:#242D34;   /* broadcast surfaces — constant in both themes */
  --f-disp:'Archivo',-apple-system,system-ui,sans-serif;
  --f-body:'IBM Plex Sans',-apple-system,system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --sh-1:0 1px 2px rgba(16,21,25,.05),0 8px 24px -14px rgba(16,21,25,.14);
  --sh-2:0 2px 4px rgba(16,21,25,.06),0 24px 48px -18px rgba(16,21,25,.25);
  --shell:1280px; --demo-h:34px; --nav-h:64px; --tick-h:36px;
  /* The map is a picture, not a broadcast surface, so unlike --bc it has to hold a value in each
     theme. Light reads like a printed atlas: land paler than the water, one mid-tone coastline
     doing the drawing. Every one of these is paired below, so nothing on the map can end up
     hard-coded dark on a light page. */
  /* Liquid-glass surface: translucent enough that the backdrop reads through, opaque enough
     that text on it still clears contrast. Every surface that used --paper flat now uses this. */
  --glass:rgba(255,255,255,.72); --glass-line:rgba(16,21,25,.10);
  --map-sea-1:#EAF1F5; --map-sea-2:#DDE7EC; --map-land:#FBFCFA; --map-coast:#8FA3B0;
  --map-bord:#C2D0D8; --map-lake:#DCE8EF;
  /* motion: one easing and one beat for the whole page, so the choreography feels authored */
  --ease-out:cubic-bezier(.22,.9,.3,1); --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --beat:70ms;
  /* THE EMBER RAMP — the reference's flowing ribbon light, run through the league's own colours.
     It ends in oxblood rather than magenta and violet on purpose: the brand is chrome yellow and
     gold, and the design standards ban a pink-to-purple ramp outright. Five stops, warm to deep,
     used for the hero light, the chart fills and the bar ladder. */
  --em-1:#FFE86B; --em-2:#FFC21F; --em-3:#F58120; --em-4:#D8391F; --em-5:#7A1526;
  /* the ramp above is for FILLS. Ember orange as text is 2.61:1 on a pale card, so text
     that wants to read as ember uses this instead — and it flips per theme. */
  --em-ink:#B23A10;
}
/* ---------- dark theme ("Night Game") — broadcast surfaces stay constant ---------- */
html[data-theme="dark"]{
  --ice:#0F1215; --paper:#171C21; --ink:#E9EEEB; --ink-2:#D7DEDA; --ink-3:#C4CCC8;
  --steel:#9AA9AF; --steel-2:#7E8D94; --line:#262E34; --line-soft:#1D252B;
  --chrome-deep:#D8BE00; --chrome-tint:#2E2A0E; --viz-accent:#E5C900;
  --red-tint:#3A1D1B; --green-tint:#15311F;
  --red-ink:#F08880; --green-ink:#4FC486; --amber-ink:#E8D34F;
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 8px 24px -14px rgba(0,0,0,.6);
  --sh-2:0 2px 4px rgba(0,0,0,.55),0 24px 48px -18px rgba(0,0,0,.72);
  --glass:rgba(23,28,33,.62); --glass-line:rgba(255,255,255,.09);
  --map-sea-1:#16202b; --map-sea-2:#0D1216; --map-land:#212f3e; --map-coast:#4a5d70;
  --map-bord:#334356; --map-lake:#131c25;
  --em-ink:#FF9A5A;
  color-scheme:dark;
}
html[data-theme="dark"] #masthead{background:rgba(15,18,21,.92)}
html[data-theme="dark"] .chip-win{border-color:#1E4A31}
html[data-theme="dark"] .chip-loss{border-color:#57302D}
html[data-theme="dark"] .chip-warn{border-color:#4A431C}
html[data-theme="dark"] .kpi.alert{border-color:#8A3A34}
*{box-sizing:border-box} html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--ice);color:var(--ink);font-family:var(--f-body);
  font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
p{margin:0} a{color:inherit;text-decoration:none} img,svg{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
::selection{background:var(--chrome);color:#101519}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:3px}
.sec-dark :focus-visible,#masthead :focus-visible{outline-color:var(--chrome)}

.skip{position:absolute;left:-9999px;top:0;background:var(--chrome);color:#101519;
  padding:10px 16px;font-weight:700;z-index:200;border-radius:0 0 var(--r-s) 0}
.skip:focus{left:0}
/* screen-reader-only, permanently — unlike .skip it never reveals on focus, so only put
   non-interactive text in it (headings, labels, table captions) */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.shell{max-width:var(--shell);margin:0 auto;padding:0 26px}
.mono{font-family:var(--f-mono)} .num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--steel)}
.eyebrow.chr{color:var(--ink)}
.eyebrow.chr::before{content:"";display:inline-block;width:26px;height:9px;background:var(--chrome);
  margin-right:9px;vertical-align:0}
.sec-dark .eyebrow{color:var(--on-ink-dim)}
.sec-dark .eyebrow.chr{color:var(--on-ink)}
.h-page{font-size:clamp(28px,3.6vw,46px);font-weight:900;letter-spacing:-.02em;line-height:.94}
.h-sec{font-size:clamp(28px,3.6vw,46px);font-weight:900;letter-spacing:-.02em;line-height:.94}
.h-card{font-size:16.5px;font-weight:700;letter-spacing:.02em}
.lede{font-size:clamp(15.5px,1.6vw,17.5px);color:var(--steel);max-width:62ch}
.small{font-size:13px} .caption{font-size:12px;color:var(--steel)}
.tnum{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}

/* ---------- buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:var(--r-s);
  font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.01em;white-space:nowrap;
  border:1.5px solid transparent;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;
  min-height:44px}
.btn:active{transform:scale(.98)}
.btn-ink{background:var(--ink);color:var(--ice)}
.btn-ink:hover{background:var(--ink-3)}
.btn-chrome{background:var(--chrome);color:#101519}
.btn-chrome:hover{background:#FFF04D;box-shadow:var(--sh-1)}
.btn-ghost{border-color:var(--line);background:var(--paper);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.sec-dark .btn-ghost{background:transparent;border-color:#39434B;color:var(--on-ink)}
.sec-dark .btn-ghost:hover{border-color:var(--chrome);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:7px 13px;font-size:13px;min-height:36px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:100px;
  font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line);color:var(--steel);background:var(--paper)}
.chip-ink{background:var(--bc);color:var(--on-ink);border-color:var(--bc)}
.chip-chrome{background:var(--chrome);color:#101519;border-color:var(--chrome)}
.chip-live{background:var(--red);color:#fff;border-color:var(--red)}
.chip-win{background:var(--green-tint);color:var(--green-ink);border-color:#BFE3CE}
.chip-loss{background:var(--red-tint);color:var(--red-ink);border-color:#F0C7C4}
.chip-warn{background:var(--chrome-tint);color:var(--amber-ink);border-color:#EBD98A}
/* size-only modifier — padding stays put so it can be dropped on any existing chip */
.chip-xs{font-size:9px}
/* a card row that navigates. Focus is visible because these are reached by keyboard as often as
   by pointer — the global data-go handler activates them on Enter and Space. */
.row-go{cursor:pointer;transition:background .12s}
.row-go:hover{background:var(--ice)}
.row-go:focus-visible{outline:2px solid var(--chrome);outline-offset:-2px;background:var(--ice)}
/* a logo specimen that downloads its PNG on click. The cue is chrome-on-ink so it reads on any
   panel background — dark badge, white paper, or ice — and only appears on hover/focus. */
.logo-dl{display:block;width:100%;padding:0;border:none;background:none;color:inherit;font:inherit;cursor:pointer}
.logo-dl:focus-visible{outline:2px solid var(--chrome);outline-offset:-2px}
.logo-dl-cue{position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;gap:4px;
  font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:#101519;background:var(--chrome);border-radius:100px;padding:3px 8px;opacity:0;transition:opacity .15s;pointer-events:none}
.logo-dl:hover .logo-dl-cue,.logo-dl:focus-visible .logo-dl-cue{opacity:1}
.live-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.live-dot{animation:none}}

/* ---------- demo bar / masthead / ticker ---------- */
#demobar{background:var(--bc2);color:var(--on-ink-dim);height:var(--demo-h);font-family:var(--f-mono);font-size:11px}
#demobar .shell{height:100%;display:flex;align-items:center;gap:14px}
#demobar b{color:var(--chrome);font-weight:600;letter-spacing:.14em}
#demobar .db-roles{display:flex;gap:4px;margin-left:auto}
#demobar .db-roles button{padding:3px 9px;border-radius:5px;color:var(--on-ink-dim);font-family:var(--f-mono);font-size:11px;min-height:26px}
#demobar .db-roles button:hover{color:#fff}
#demobar .db-roles button.on{background:var(--chrome);color:#101519;font-weight:600}
#demobar .db-reset{color:var(--on-ink-dim);text-decoration:underline dotted}
/* the ticker sits on the constant-dark broadcast surface, so the page's fill-red reads too dark as
   text here (the TONIGHT label is inline-styled var(--red)) — lift it to the dark-theme ink */
#ticker{background:var(--bc);color:var(--on-ink);height:var(--tick-h);overflow:hidden;position:relative;--red:#F08880}
#ticker .tk-track{display:flex;width:max-content;height:100%;align-items:center;animation:tkscroll 60s linear infinite}
#ticker:hover .tk-track,#ticker:focus-within .tk-track{animation-play-state:paused}
@keyframes tkscroll{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){#ticker .tk-track{animation:none}}
.tk-item{display:inline-flex;align-items:center;gap:8px;padding:0 22px;font-family:var(--f-mono);
  font-size:12px;white-space:nowrap;height:100%;border-right:1px solid #232B31}
.tk-item .tk-lab{color:var(--on-ink-dim);font-size:10px;letter-spacing:.12em}
.tk-item b{font-weight:600} .tk-item .win{color:var(--chrome)}
.tk-item.tk-stat .tk-lab{color:var(--chrome)}
.tk-item .tk-val{font-weight:600;color:var(--on-ink)}
.tk-item .crest{width:26px;height:28px}
.tk-item:hover b{color:var(--chrome)}
#masthead{position:sticky;top:0;z-index:80;background:rgba(245,246,242,.92);
  -webkit-backdrop-filter:blur(12px) saturate(140%);
  backdrop-filter:blur(12px) saturate(140%);border-bottom:1.5px solid var(--ink)}
.mh{height:var(--nav-h);display:flex;align-items:center;gap:20px}
.mh-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
/* the brand block must give way on narrow phones or the burger overflows the viewport */
@media(max-width:430px){
  .mh{gap:10px}
  .mh-brand{gap:8px}
  .mh-brand .crest{width:31px;height:31px}
  .mh-brand .wm b{font-size:14px}
  .mh-brand .wm span{letter-spacing:.18em}
}
.mh-brand .crest{width:36px;height:36px}
.mh-brand .wm b{display:block;font-family:var(--f-disp);font-weight:900;font-size:16px;letter-spacing:-.01em;line-height:1}
.mh-brand .wm span{font-family:var(--f-mono);font-size:9px;letter-spacing:.3em;color:var(--steel);text-transform:uppercase}
.mh-nav{display:flex;gap:2px;height:100%}
.mh-nav a{display:inline-flex;align-items:center;padding:0 13px;font-family:var(--f-disp);
  font-weight:600;font-size:14px;color:var(--steel);position:relative;letter-spacing:.005em;white-space:nowrap}
.mh-nav a:hover{color:var(--ink)}
.mh-nav a.on{color:var(--ink)}
.mh-nav a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1.5px;height:3.5px;background:var(--chrome)}
.mh-dd{position:relative;display:flex;height:100%}
.mh-dd>a{display:inline-flex;align-items:center;gap:5px;padding:0 13px;font-family:var(--f-disp);
  font-weight:600;font-size:14px;color:var(--steel);position:relative;letter-spacing:.005em;white-space:nowrap}
.mh-dd>a:hover,.mh-dd>a[aria-expanded="true"]{color:var(--ink)}
.mh-dd>a svg{width:11px;height:11px;transition:transform .15s}
.mh-dd>a[aria-expanded="true"] svg{transform:rotate(180deg)}
.mh-dd>a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1.5px;height:3.5px;background:var(--chrome)}
.mh-dd .pop{left:0;right:auto;min-width:220px}
.mh-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.icon-btn{width:42px;height:42px;border-radius:var(--r-s);display:grid;place-items:center;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);position:relative;transition:border-color .15s}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .bub{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-family:var(--f-mono);
  font-size:10px;font-weight:600;min-width:17px;height:17px;border-radius:100px;display:grid;place-items:center;padding:0 4px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--bc);color:var(--chrome);
  display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:14px;border:1.5px solid var(--bc)}
.avatar.guest{background:var(--paper);color:var(--steel);border-color:var(--line)}
.avatar{overflow:hidden;padding:0}
.mh-burger{display:none}
/* drops secondary words from a label on narrow screens; the element keeps its full accessible
   name via aria-label, so only the visual text shortens */
@media (max-width:520px){ .hide-xs{display:none} }
.seasel{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;border:1.5px solid var(--line);
  background:var(--paper);border-radius:var(--r-s);padding:8px 10px;color:var(--steel);min-height:42px}

/* dropdown menus (account / notifications) */
.pop{position:absolute;top:calc(100% + 10px);right:0;min-width:280px;background:var(--paper);
  border:1.5px solid var(--ink);border-radius:var(--r-m);box-shadow:var(--sh-2);z-index:90;overflow:hidden}
.pop-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.pop-item{display:flex;width:100%;align-items:center;gap:11px;padding:11px 16px;font-size:14px;
  font-weight:500;text-align:left;transition:background .12s;min-height:44px}
.pop-item:hover{background:var(--ice)}
.pop-item svg{width:16px;height:16px;color:var(--steel);flex-shrink:0}
.pop-sep{height:1px;background:var(--line);margin:5px 0}

/* ---------- sections / cards / grids ---------- */
main{min-height:60vh}
.sec{padding:clamp(20px,2.3vw,34px) 0}
.sec-dark{background:var(--bc);color:var(--on-ink)}
.sec-dark .h-sec,.sec-dark .h-page{color:#fff}
.sec-tight{padding:clamp(12px,1.4vw,19px) 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:15px;flex-wrap:wrap}
.sec-head .lead{max-width:680px}
.sec-head h2{margin-top:10px}
.sec-link{font-family:var(--f-disp);font-weight:700;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;
  border-bottom:2.5px solid var(--chrome);padding-bottom:2px;transition:gap .15s;white-space:nowrap}
.sec-link:hover{gap:11px}
/* the same surface the home page uses, so a card is a card wherever you are */
.card{background:var(--glass,var(--paper));border:1px solid var(--glass-line,var(--line));
  border-radius:var(--r-m);overflow:hidden;
  -webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5)}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .card{background:var(--paper);border-color:var(--line)}}
.card.raise{transition:transform .18s,box-shadow .18s,border-color .18s}
.card.raise:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--ink)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.card-b{padding:18px}
.sec-dark .card{background:var(--bc2);border-color:#2A343B}
.sec-dark .card-h{border-color:#2A343B}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:1.9fr 1fr}.g32{grid-template-columns:1fr 1.9fr}.g5x7{grid-template-columns:1.35fr 1fr}
.grid>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:18px}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl caption{text-align:left;padding:0 0 8px;font-family:var(--f-mono);font-size:11px;color:var(--steel);letter-spacing:.08em;text-transform:uppercase}
.tbl caption.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tbl.compact th,.tbl.compact td{padding-left:5px;padding-right:5px;font-size:12.5px}
.tbl.compact th:first-child,.tbl.compact td:first-child{padding-left:12px}
.tbl.compact .teamcell .nm{font-size:12.5px}
.tbl th{font-family:var(--f-mono);font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--steel);text-align:right;padding:10px 9px;border-bottom:1.5px solid var(--ink);white-space:nowrap;cursor:default}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th.sorted{color:var(--ink)}
.tbl th.sorted::after{content:" ↓";color:var(--chrome-deep)}
.tbl th.sorted.asc::after{content:" ↑"}
/* per-column filter row — injected under every table header (CG.tableFilters). The row is
   hidden until the funnel toggle in the last header cell switches it on, so tables stay
   clean by default and mobile isn't paying for a row of inputs it didn't ask for. */
.tbl-fbtn{background:none;border:0;cursor:pointer;color:var(--steel);padding:2px 4px;margin-left:6px;font-size:11px;line-height:1;vertical-align:1px}
.tbl-fbtn:hover,.tbl-fbtn.on{color:var(--chrome-deep)}
.tbl tr.tbl-filter th{padding:4px 6px;border-bottom:1px solid var(--line);background:var(--ice)}
.tbl tr.tbl-filter input{width:100%;min-width:52px;padding:5px 7px;font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--paper);border-radius:0}
.tbl tr.tbl-filter input:focus{outline:2px solid var(--chrome);outline-offset:-1px}
/* ---- forums ---- */
/* Board cards and thread rows are the same object: a whole-card link. The title alone was a
   thin target with dead space either side of it, and everything in the row points at the same
   thread anyway. Nothing interactive is nested inside, so the <a> can own the click. */
a.fx-board,a.fx-thread{display:block;text-decoration:none;color:inherit}
a.fx-board:hover .fx-title,a.fx-thread:hover .fx-title{color:var(--chrome-deep)}
a.fx-board:focus-visible,a.fx-thread:focus-visible{outline:2px solid var(--chrome);outline-offset:2px}
.fx-row{display:flex;gap:14px;align-items:flex-start;padding:16px 18px}
.fx-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.fx-title{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:16px;line-height:1.3}
/* two lines of the post itself, so a row carries some of the conversation instead of a
   title floating in white space */
.fx-excerpt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:13px;line-height:1.55;color:var(--steel);overflow-wrap:anywhere}
.fx-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--steel-2)}
.fx-meta b{font-family:var(--f-disp);color:var(--steel);font-size:12px}
.fx-latest{display:flex;gap:7px;align-items:center;min-width:0;font-size:12px;color:var(--steel)}
.fx-latest .fx-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-ago{flex:none;font-size:11px;color:var(--steel-2)}
/* the right rail: reply count reads as a stat, not a stray number */
.fx-stat{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;min-width:74px;padding:4px 0 4px 14px;border-left:1px solid var(--line-soft);align-self:stretch}
.fx-stat .num{font-family:var(--f-disp);font-size:22px;line-height:1}
.fx-stat .caption{font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.fx-last{font-size:10.5px;color:var(--steel-2);margin-top:3px;text-align:center}
.fx-bic{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;
  background:var(--chrome-tint);color:var(--chrome-deep)}
/* initial disc — a fixed left column for every row and every post to line up against */
.fx-av{flex:none;display:grid;place-items:center;width:var(--av,40px);height:var(--av,40px);
  border-radius:50%;font-family:var(--f-disp);font-weight:800;
  font-size:calc(var(--av,40px) * .42);line-height:1;
  color:hsl(var(--h) 62% 34%);background:hsl(var(--h) 62% 90%);
  border:1px solid hsl(var(--h) 45% 80%)}
.fx-byline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.fx-post .card-b{padding:16px 18px}
.fx-op{border-color:var(--chrome)}
@media (max-width:560px){
  .fx-row{padding:14px;gap:11px;flex-wrap:wrap}
  /* the stat rail becomes a footer strip rather than squeezing the title into a column */
  .fx-stat{flex-direction:row;align-items:baseline;gap:6px;min-width:0;padding:0;border-left:0;
    order:3;width:100%;justify-content:flex-start}
  .fx-stat .num{font-size:15px}
  .fx-av,.fx-bic{--av:32px;width:32px;height:32px}
}
/* Every surface that renders text a member typed. Titles and excerpts are as likely
   to be a bare pasted invite link as a sentence, and .card is overflow:hidden — an
   unbreakable token doesn't scroll here, it gets silently cut off. */
.fx-h,.fx-txt{overflow-wrap:anywhere}
/* These are headings for semantics — a screen reader needs to hear the thread list
   as a list of headings — but the site's h1-h4 rule uppercases everything, and a
   thread title is the member's own sentence. "LW looking for a club, PS5 evenings"
   is not the same line once it's shouted. Editorial headings the league writes keep
   the uppercase treatment; text a member typed keeps their capitalisation. */
.fx-h{font-family:var(--f-disp);margin:0}
.fx-h,h1.fx-txt{text-transform:none}
.fx-body{font-size:14.5px;line-height:1.65;color:var(--ink);overflow-wrap:anywhere}
.fx-body p{margin:0 0 10px}
.fx-body p:last-child{margin-bottom:0}
/* member-typed links: visibly a link, and never allowed to blow the column out */
a.fx-link{color:var(--chrome-deep);border-bottom:1px solid var(--chrome);overflow-wrap:anywhere}
a.fx-link:hover{background:var(--chrome-tint)}
.fx-gone{opacity:.55}
.fx-thread a{text-decoration:none}
.fx-thread a:hover{color:var(--chrome-deep)}
.rinkrule-lite{display:flex;align-items:center;gap:10px;color:var(--steel);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.rinkrule-lite::after{content:"";flex:1;height:1px;background:var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:16px}
.tbl th.tleft,.tbl td.tleft{text-align:left}
.tbl td{padding:11px 9px;text-align:right;border-bottom:1px solid var(--line-soft);
  font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.tbl td.tleft{font-family:var(--f-body)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.rowlink{cursor:pointer;transition:background .12s}
.tbl tbody tr.rowlink td:first-child{box-shadow:inset 3px 0 0 var(--tc,transparent)}
.tbl tbody tr.rowlink:hover td{background:color-mix(in srgb,var(--tc,#8595A0) 10%,transparent)}
.tbl td.z{color:var(--steel-2)}
.tbl td.pts{font-weight:700}
.tbl .cutline td{border-bottom:2.5px dashed var(--chrome-deep)}
.teamcell{display:flex;align-items:center;gap:10px;min-width:0}
.teamcell .nm{font-family:var(--f-disp);font-weight:700;font-size:13.5px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamcell small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--steel)}
.playercell{display:flex;align-items:center;gap:10px;min-width:0}
.playercell .nm{font-weight:600;font-size:13.5px;font-family:var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playercell small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--steel)}
.rankn{font-family:var(--f-mono);color:var(--steel);font-size:12px;width:18px;display:inline-block}
.sec-dark .tbl th{color:var(--on-ink-dim);border-bottom-color:#3A444C}
.sec-dark .tbl td{border-bottom-color:#232B31}

/* form5 = last-5 dots. Result is carried by SHAPE first — solid / hollow / half — so the row still
   reads with the color stripped out. Colour is the second signal, never the only one.
   Legacy .w/.l/.o are kept as aliases until every caller emits the semantic names. */
.form5{display:inline-flex;gap:3px}
.form5 i{width:8px;height:8px;border-radius:2px;background:transparent;border:2px solid var(--steel-2)}
.form5 i.fd-w,.form5 i.w{background:var(--green-ink);border-color:var(--green-ink)}
.form5 i.fd-l,.form5 i.l{background:transparent;border-color:var(--red-ink)}
.form5 i.fd-otl,.form5 i.o{border-color:var(--amber-ink);
  background:linear-gradient(var(--amber-ink) 0 50%,transparent 50%)}

/* ---------- crest ----------
   Team logos read as dimensional everywhere: a subtle drop-shadow lifts the mark off the surface
   site-wide (nav, tables, cards, box scores). The featured .crest3d wrapper deepens this into a
   full perspective tilt for the club page + player-profile hero. */
.crest{flex-shrink:0;display:block;filter:drop-shadow(0 1.5px 2px rgba(0,0,0,.2))}

/* ---------- hero carousel ---------- */
/* The hero follows the theme rather than staying a fixed broadcast surface: the map underneath
   it now renders as a light atlas in light mode, and a permanently dark band above a light map
   left the wordmark near-black on near-black. */
#hero{background:var(--map-sea-1);color:var(--ink);position:relative;overflow:hidden}
#hero::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:var(--line)}
/* The map's sea tone rises out of the band above it rather than starting against it, so the
   wordmark and the map still read as one picture with no seam between them. */
#hero .na-wrap{position:relative;z-index:1;background:linear-gradient(to bottom,
  transparent 0%,color-mix(in srgb,var(--map-sea-1) 70%,transparent) 14%,var(--map-sea-1) 34%,var(--map-sea-2) 100%)}
@supports not (color: color-mix(in srgb,red,blue)){
  #hero .na-wrap{background:linear-gradient(to bottom,transparent 0%,var(--map-sea-1) 30%,var(--map-sea-2) 100%)}
}
.hero-grid{display:grid;grid-template-columns:1.75fr 1fr;gap:0;align-items:stretch}
.caro{position:relative;min-height:430px;outline:none}
/* ================= MOTION SYSTEM =================
   One easing (--ease-out), one beat (--beat), one rule: NOTHING is hidden until html.rv-on
   exists, and JS only adds that once it holds a working IntersectionObserver. A reveal that
   hides content and waits for a callback is one suspended observer away from a blank page.

   Each treatment is matched to what it reveals — a heading rises from behind its own edge, a
   crest is dealt, a chart draws itself, a figure counts. That is what keeps a page this heavily
   animated reading as choreography rather than as effects piled on. */
html.rv-on [data-rv]{opacity:0;
  transition:opacity .68s var(--ease-out) calc(var(--rv-i,0)*var(--beat)),
             transform .78s var(--ease-out) calc(var(--rv-i,0)*var(--beat))}
html.rv-on [data-rv].rv-in{opacity:1;transform:none}
html.rv-on [data-rv="up"]{transform:translateY(30px)}
html.rv-on [data-rv="pop"]{transform:scale(.88)}
html.rv-on [data-rv="slide"]{transform:translateX(-34px)}
html.rv-on [data-rv="slide-r"]{transform:translateX(34px)}
html.rv-on [data-rv="deal"]{transform:translateY(34px) rotate(-8deg) scale(.84);
  transition:opacity .5s var(--ease-out) calc(var(--rv-i,0)*var(--beat)),
             transform .72s var(--ease-spring) calc(var(--rv-i,0)*var(--beat))}
/* clip-path lives ONLY on the mask variant, so nothing else has its shadow or hover lift
   clipped by an inherited inset */
html.rv-on [data-rv="mask"]{transform:translateY(16px);clip-path:inset(0 0 103% 0);
  transition:opacity .55s ease calc(var(--rv-i,0)*var(--beat)),
             transform .8s var(--ease-out) calc(var(--rv-i,0)*var(--beat)),
             clip-path .9s var(--ease-out) calc(var(--rv-i,0)*var(--beat))}
html.rv-on [data-rv="mask"].rv-in{clip-path:inset(-14% -8% -14% -8%)}
/* An SVG line that draws itself. The dash values are written by JS, which is the only thing that
   can call getTotalLength() — CSS only owns the transition. Deliberately NOT hidden here: if the
   script never runs the line is simply drawn, whereas a CSS-side hide would leave the chart blank
   forever. (It was: routing the length through var(--len) resolved to the fallback and the curve
   rendered with dash 653 / offset 1000 — invisible.) */
html.rv-on [data-rv="draw"] .rv-draw{
  transition:stroke-dashoffset 1.5s var(--ease-out) calc(140ms + var(--rv-i,0)*var(--beat))}
html.rv-on [data-rv="draw"] .rv-dot{opacity:0;transition:opacity .4s ease calc(900ms + var(--rv-i,0)*var(--beat))}
html.rv-on [data-rv="draw"].rv-in .rv-dot{opacity:1}
/* columns grow out of the axis */
html.rv-on [data-rv] .rv-col{transform:scaleY(0);transform-origin:bottom;
  transition:transform .85s var(--ease-spring) calc(var(--rv-i,0)*var(--beat) + var(--col-i,0)*55ms)}
html.rv-on [data-rv].rv-in .rv-col{transform:scaleY(1)}
/* meters fill on the same beat as the figure counting up beside them */
.rv-meter{position:relative;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.rv-meter i{position:absolute;inset:0;transform-origin:left center;border-radius:99px;
  background:linear-gradient(90deg,var(--viz-accent),var(--gold));transform:scaleX(var(--v,0))}
html.rv-on [data-rv] .rv-meter i{transform:scaleX(0);
  transition:transform 1.15s var(--ease-out) calc(120ms + var(--rv-i,0)*var(--beat))}
html.rv-on [data-rv].rv-in .rv-meter i{transform:scaleX(var(--v,0))}
/* split-text: each word rides up out of its own mask */
.rv-word{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .12em;margin-bottom:-.12em}
.rv-word>i{display:inline-block;font-style:inherit}
html.rv-on [data-rv="words"] .rv-word>i{transform:translateY(112%);
  transition:transform .8s var(--ease-out) calc(var(--w-i,0)*48ms)}
html.rv-on [data-rv="words"].rv-in .rv-word>i{transform:translateY(0)}
html.rv-on [data-rv="words"]{opacity:1}          /* the words carry the entrance, not the block */

/* ---- scroll-linked motion ----
   Where the browser supports scroll-driven animations, sections keep moving WITH the scroll rather
   than snapping in once — the difference between a page that reveals and one that feels continuous.

   EVERY variant gets a timeline, not just some. Giving it only to "up" and "pop" split the system
   in two: those arrived off the scroll while "mask" and the rest still waited on the observer, so a
   section could show its buttons and hide its heading and body copy. That is exactly what a reader
   reported seeing. One mechanism, applied uniformly, or the page can disagree with itself. */
@supports (animation-timeline: view()){
  @media(prefers-reduced-motion:no-preference){
    html.rv-on [data-rv]{animation:rv-arrive linear both;animation-timeline:view();
      animation-range:entry 6% cover 30%}
    html.rv-on [data-rv="mask"]{animation-name:rv-arrive-mask}
    html.rv-on [data-rv="deal"]{animation-name:rv-arrive-deal}
    html.rv-on [data-rv="slide"]{animation-name:rv-arrive-slide}
    html.rv-on [data-rv="slide-r"]{animation-name:rv-arrive-slide-r}
    /* once the observer has said it arrived, it stays arrived */
    html.rv-on [data-rv].rv-in{animation:none}
    @keyframes rv-arrive{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
    @keyframes rv-arrive-mask{
      from{opacity:0;transform:translateY(16px);clip-path:inset(0 0 103% 0)}
      to{opacity:1;transform:none;clip-path:inset(-14% -8% -14% -8%)}}
    @keyframes rv-arrive-deal{
      from{opacity:0;transform:translateY(34px) rotate(-8deg) scale(.84)}
      to{opacity:1;transform:none}}
    @keyframes rv-arrive-slide{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
    @keyframes rv-arrive-slide-r{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
    /* the chart cards drift a little slower than the page, which is what reads as depth */
    .vzgrid .vz[data-rv]:not(.rv-in){animation-name:vz-float;animation-range:entry 0% exit 100%}
    @keyframes vz-float{from{opacity:1;transform:translateY(14px)}to{opacity:1;transform:translateY(-14px)}}
  }
}

/* ---- cursor: things you can act on lean toward the pointer ---- */
@media(hover:hover) and (pointer:fine){
  .tilt{transition:transform .3s var(--ease-spring)}
  .tilt:hover{transform:translateY(-4px) scale(1.06)}
  .mag{transition:transform .25s var(--ease-spring),box-shadow .25s ease}
  .mag:hover{transform:translateY(-2px)}
}
@media(prefers-reduced-motion:reduce){
  html.rv-on [data-rv],html.rv-on [data-rv].rv-in{opacity:1;transform:none;clip-path:none;transition:none}
  html.rv-on [data-rv] .rv-meter i,html.rv-on [data-rv].rv-in .rv-meter i{transition:none;transform:scaleX(var(--v,0))}
  html.rv-on [data-rv] .rv-col,html.rv-on [data-rv].rv-in .rv-col{transition:none;transform:scaleY(1)}
  html.rv-on [data-rv="draw"] .rv-draw{transition:none}
  html.rv-on [data-rv="draw"] .rv-dot{opacity:1;transition:none}
  html.rv-on [data-rv="words"] .rv-word>i{transform:none;transition:none}
  .tilt,.mag,.tilt:hover,.mag:hover{transform:none;transition:none}
}

/* ---- the numbers band ---- */
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fig{padding:20px 24px 19px;border-left:1px solid var(--line)}
.fig:first-child{border-left:0}
.fig b{display:block;font-family:var(--f-disp);font-size:clamp(46px,5.6vw,84px);line-height:.9;
  color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.03em;font-weight:800}
.fig .fig-l{display:block;margin-top:11px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--steel)}
.fig .fig-s{display:block;margin-top:8px;font-size:13px;line-height:1.45;color:var(--steel)}
.fig .rv-meter{margin-top:14px}
@media(max-width:900px){.figs{grid-template-columns:repeat(2,1fr)}
  .fig:nth-child(3){border-left:0}.fig:nth-child(n+3){border-top:1px solid var(--line)}}
@media(max-width:460px){.figs{grid-template-columns:1fr}
  .fig{border-left:0}.fig+.fig{border-top:1px solid var(--line)}}

/* ================= CG.viz — one chart language for the whole site =================
   Modelled on the reference set: a titled card, the figure in the corner, the plot beneath, and
   labels riding inside the bars so no chart needs a legend. Violet there, ember here. */
.vz{position:relative;margin:0;padding:18px 18px 16px;border-radius:10px;
  background:var(--glass,var(--paper));border:1px solid var(--glass-line,var(--line));
  -webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);
  display:flex;flex-direction:column;gap:14px;overflow:hidden}
/* no backdrop-filter support: fall back to the solid surface rather than a washed-out panel */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .vz{background:var(--paper);border-color:var(--line)}}
.vz-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.vz-t b{display:block;font-family:var(--f-disp);font-weight:700;font-size:15.5px;color:var(--ink);
  letter-spacing:.01em}
.vz-t span{display:block;margin-top:3px;font-size:12.5px;line-height:1.45;color:var(--em-ink)}
.vz-v{font-family:var(--f-disp);font-weight:800;font-size:clamp(20px,2vw,26px);color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.vz-note{margin:0;font-size:12px;line-height:1.5;color:var(--steel)}

/* ---- vertical bars ----
   Reference proportions: a tall plot, narrow columns that do NOT stretch to fill the card, and
   corners near-square. Wide soft-cornered bars were most of what made these read as cheap. */
.vz-bars{display:flex;align-items:flex-end;justify-content:space-between;gap:clamp(6px,1.4vw,16px);
  height:clamp(168px,22vh,224px);padding:0 2px}
.vz-bar{display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;
  justify-content:flex-end;flex:1 1 0;max-width:44px}
.vz-bv{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1}
.vz-bt{width:100%;flex:1 1 auto;display:flex;align-items:flex-end;
  background:var(--line-soft);border-radius:2px;overflow:hidden}
.vz-bt>i{position:relative;display:block;width:100%;border-radius:2px;transform-origin:bottom;
  background:var(--em-2)}
.vz-bar.on .vz-bt>i{background:var(--em-4)}
.vz-bar.on .vz-bv,.vz-bar.on .vz-bl{color:var(--em-ink);font-weight:700}
.vz-bl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--steel);
  text-transform:uppercase;line-height:1}

/* ---- horizontal bars, label inside the bar ---- */
.vz-hbars{display:flex;flex-direction:column;gap:6px}
.vz-hb{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:11px}
.vz-hbt{position:relative;height:26px;border-radius:2px;background:var(--line-soft);overflow:hidden;
  display:flex;align-items:center}
.vz-hbt>i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;transform-origin:left center;
  background:linear-gradient(90deg,var(--hb,var(--em-2)),color-mix(in srgb,var(--hb,var(--em-3)) 72%,var(--em-4)))}
@supports not (color: color-mix(in srgb,red,blue)){
  .vz-hbt>i{background:linear-gradient(90deg,var(--hb,var(--em-2)),var(--em-4))}}
/* The label sits INSIDE the bar but routinely overruns it onto the track, so one ink has to read on
   both. It is pinned to the dark end of the ramp rather than var(--ink): the fill is a bright ember
   in either theme, so in dark mode a light --ink washed out to 1.4:1 the moment a bar grew under it.
   The track is lifted to match, which keeps the same ink legible where the label overruns. */
.vz-hbt{background:var(--hb-track,var(--line-soft))}
.vz-hbt>em{position:relative;z-index:1;padding:0 11px;font-family:var(--f-mono);font-size:10.5px;
  font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#101519;font-style:normal;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-color-scheme:dark){ :root{--hb-track:#C6CDD4} }
html[data-theme="dark"]{--hb-track:#C6CDD4}

.vz-hbv{font-family:var(--f-mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- donut ---- */
.vz-donut{position:relative;display:grid;place-items:center;padding:2px 0}
.vz-donut svg{width:clamp(124px,15vw,164px);height:auto;transform:rotate(-90deg)}
.vz-dtrack{fill:none;stroke:var(--line-soft);stroke-width:16}
.vz-dfill{fill:none;stroke:var(--em-3);stroke-width:16;stroke-linecap:butt;
  stroke-dasharray:var(--dash);stroke-dashoffset:calc(var(--dash) - var(--fill))}
.vz-dmid{position:absolute;text-align:center}
.vz-dmid b{display:block;font-family:var(--f-disp);font-weight:800;font-size:clamp(24px,2.6vw,32px);
  color:var(--em-ink);line-height:1;font-variant-numeric:tabular-nums}

  text-transform:uppercase;color:var(--steel)}

/* ---- area ---- */

  vector-effect:non-scaling-stroke}

  letter-spacing:.08em;color:var(--steel);padding-top:8px}

/* ---- how each primitive arrives ---- */
html.rv-on .vz[data-rv] .vz-bt>i{transform:scaleY(0)}
html.rv-on .vz[data-rv].rv-in .vz-bt>i{transform:scaleY(1);
  transition:transform .8s var(--ease-spring) calc(var(--i,0)*60ms)}
html.rv-on .vz[data-rv] .vz-hbt>i{transform:scaleX(0)}
html.rv-on .vz[data-rv].rv-in .vz-hbt>i{transform:scaleX(1);
  transition:transform .85s var(--ease-out) calc(var(--i,0)*60ms)}
html.rv-on .vz[data-rv] .vz-dfill{stroke-dashoffset:var(--dash)}
html.rv-on .vz[data-rv].rv-in .vz-dfill{stroke-dashoffset:calc(var(--dash) - var(--fill));
  transition:stroke-dashoffset 1.2s var(--ease-out) .1s}

  html.rv-on .vz[data-rv] .vz-hbt>i,html.rv-on .vz[data-rv].rv-in .vz-hbt>i{transform:scaleX(1);transition:none}
  html.rv-on .vz[data-rv] .vz-dfill,html.rv-on .vz[data-rv].rv-in .vz-dfill{
    stroke-dashoffset:calc(var(--dash) - var(--fill));transition:none}

/* the chart grid: a wide card spans two columns so the time series gets the room it needs */

.vzgrid .vz-wide{grid-column:1/-1}
@media(max-width:820px){.vzgrid{grid-template-columns:1fr}}


/* ---- legend + heatmap ---- */
.vz-leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:2px}

  letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}
