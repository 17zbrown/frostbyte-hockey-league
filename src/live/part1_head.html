.vz-lg>i.b{background:var(--em-4)}
.vz-lg>i.t{background:var(--line-soft);border:1px solid var(--line)}
.vz-heat{display:grid;grid-template-columns:repeat(var(--cols,7),1fr);gap:4px}
.vz-cell{display:block;aspect-ratio:1;border-radius:1px;background:var(--line-soft)}
.vz-cell.l1{background:color-mix(in srgb,var(--em-2) 30%,var(--line-soft))}
.vz-cell.l2{background:color-mix(in srgb,var(--em-2) 62%,var(--line-soft))}
.vz-cell.l3{background:var(--em-3)}
.vz-cell.l4{background:var(--em-5)}
@supports not (color: color-mix(in srgb,red,blue)){
  .vz-cell.l1{background:var(--em-1)} .vz-cell.l2{background:var(--em-2)}}
html.rv-on .vz[data-rv] .vz-cell{opacity:0;transform:scale(.72)}
html.rv-on .vz[data-rv].rv-in .vz-cell{opacity:1;transform:none;
  transition:opacity .3s ease calc(var(--i,0)*11ms),transform .4s var(--ease-spring) calc(var(--i,0)*11ms)}
html.rv-on .vz[data-rv] .vz-bt>i>b{transform:scaleY(0);transform-origin:bottom}
html.rv-on .vz[data-rv].rv-in .vz-bt>i>b{transform:scaleY(1);
  transition:transform .7s var(--ease-out) calc(260ms + var(--i,0)*60ms)}
@media(prefers-reduced-motion:reduce){
  html.rv-on .vz[data-rv] .vz-cell,html.rv-on .vz[data-rv].rv-in .vz-cell{opacity:1;transform:none;transition:none}
  html.rv-on .vz[data-rv] .vz-bt>i>b,html.rv-on .vz[data-rv].rv-in .vz-bt>i>b{transform:scaleY(1);transition:none}
}

/* ---- the pulse: charts that answer a question, in both themes ---- */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.pulsegrid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:stretch}
.pulse-card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-m);
  padding:20px 20px 6px;display:flex;flex-direction:column;overflow:hidden}
.pulse-h{display:block;margin-bottom:12px}
.pulse-big{display:block;margin-top:7px;font-family:var(--f-disp);font-weight:900;color:var(--ink);
  font-size:clamp(32px,3.6vw,50px);line-height:.94;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.pulse-sub{display:block;margin-top:7px;font-size:13px;line-height:1.5;color:var(--steel);max-width:44ch}
.pulse-svg{width:100%;height:clamp(120px,17vh,180px);margin-top:auto;display:block;overflow:visible}
.pulse-area{fill:url(#cgPulseFill)}
.pulse-line{stroke:url(#cgPulseLine);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--em-2) 55%,transparent))}
@supports not (color: color-mix(in srgb,red,blue)){.pulse-line{filter:none}}
.pulse-end{fill:var(--em-1);stroke:var(--paper);stroke-width:2}
.pulse-grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.6}
.pulse-flag{stroke:var(--em-3);stroke-width:1.5;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;opacity:.5}
/* one dot per day, arriving behind the line as it draws */
.pulse-tick{fill:var(--em-2);opacity:0}
html.rv-on [data-rv="draw"].rv-in .pulse-tick{opacity:.85;
  transition:opacity .3s ease calc(320ms + var(--tick-i,0)*55ms)}
@media(prefers-reduced-motion:reduce){.pulse-tick{opacity:.85;transition:none}}
.pulse-axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.08em;color:var(--steel);padding:6px 0 10px}
  pointer-events:none;opacity:.1}
/* position bars: the shortest column is the point of the chart, so it is the one that reads */
.poscols{display:flex;align-items:flex-end;gap:clamp(6px,1.4vw,14px);height:clamp(110px,15vh,160px);
  margin:auto 0 16px}
.poscol{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.pc-n{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pc-bar{width:100%;flex:1 1 auto;display:flex;align-items:flex-end}
/* each column is mixed further along the ember ramp by its --col-t */
.pc-bar>i{display:block;width:100%;border-radius:6px 6px 0 0;opacity:.92;
  background:linear-gradient(180deg,var(--em-2),var(--em-3));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.poscol:nth-child(even) .pc-bar>i{background:linear-gradient(180deg,var(--em-1),var(--em-2))}
/* the position the league is short of burns, and keeps pulsing until someone fills it */
.poscol.short .pc-bar>i{background:linear-gradient(180deg,var(--em-3),var(--em-5));
  box-shadow:0 0 18px color-mix(in srgb,var(--em-3) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.3);
  animation:short-pulse 2.6s ease-in-out infinite}
@supports not (color: color-mix(in srgb,red,blue)){.poscol.short .pc-bar>i{box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}}
@keyframes short-pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
.poscol.short .pc-l,.poscol.short .pc-n{color:var(--em-ink);font-weight:700}
@media(prefers-reduced-motion:reduce){.poscol.short .pc-bar>i{animation:none}}
.pc-l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--steel)}
@media(max-width:860px){.pulsegrid{grid-template-columns:1fr}}

/* ---- the ladder: standings as lanes on a sheet of ice ---- */
.ladderwrap{display:flex;flex-direction:column;gap:12px}
.ladder-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ladder-h h3{font-family:var(--f-disp);font-size:clamp(15px,1.5vw,19px);color:var(--ink)}
.ladder{display:flex;flex-direction:column;gap:5px;position:relative}
.lane{position:relative;display:grid;grid-template-columns:26px 30px minmax(0,1fr) 34% auto;
  align-items:center;gap:11px;padding:9px 13px;border-radius:10px;text-decoration:none;
  background:var(--glass,var(--paper));border:1px solid var(--glass-line,var(--line));overflow:hidden;
  -webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);
  transition:border-color .25s ease,transform .3s var(--ease-spring),box-shadow .3s ease}
/* the club's colour washes in from the boards on hover */
.lane::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,var(--team,var(--em-2)) -20%,transparent 58%);
  transition:opacity .3s ease}
.lane:hover,.lane:focus-visible{border-color:var(--team,var(--em-3));transform:translateX(4px);
  box-shadow:var(--sh-1);outline:none}
.lane:hover::after,.lane:focus-visible::after{opacity:.16}
.lane>*{position:relative;z-index:1}
.lane-rk{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--steel);
  font-variant-numeric:tabular-nums;text-align:center}
.lane.in .lane-rk{color:var(--ink)}
.lane-crest{line-height:0}
.lane-crest img,.lane-crest svg{width:30px;height:30px;object-fit:contain}
.lane-name{font-family:var(--f-disp);font-weight:700;font-size:14.5px;color:var(--ink);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-name small{display:block;font-family:var(--f-mono);font-weight:400;font-size:10.5px;
  color:var(--steel);letter-spacing:.05em;text-transform:uppercase}
.lane-track{height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden;position:relative}
.lane-track>i{display:block;height:100%;border-radius:99px;transform-origin:left center;
  background:linear-gradient(90deg,var(--em-2),var(--em-3) 55%,var(--em-4))}
/* clubs above the cut burn brighter than the ones below it */
.lane.in .lane-track>i{background:linear-gradient(90deg,var(--em-1),var(--em-2) 45%,var(--em-3))}
.lane:not(.in) .lane-track>i{opacity:.55}
.lane-val{font-family:var(--f-mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;
  white-space:nowrap}
/* the cutline: a blue line across the sheet */
.lane-cut{position:absolute;left:0;right:0;bottom:-3px;height:2px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--em-3),transparent);opacity:.85}
.lane-note{margin:8px 0 0}
/* lanes sweep in off the boards, then the tracks fill behind them */
html.rv-on .ladder[data-rv] .lane{opacity:0;transform:translateX(-26px)}
html.rv-on .ladder[data-rv].rv-in .lane{opacity:1;transform:none;
  transition:opacity .5s var(--ease-out) calc(var(--lane-i,0)*80ms),
             transform .62s var(--ease-spring) calc(var(--lane-i,0)*80ms)}
html.rv-on .ladder[data-rv] .lane-track>i{transform:scaleX(0)}
html.rv-on .ladder[data-rv].rv-in .lane-track>i{transform:scaleX(1);
  transition:transform .9s var(--ease-out) calc(220ms + var(--lane-i,0)*80ms)}
@media(prefers-reduced-motion:reduce){
  html.rv-on .ladder[data-rv] .lane,html.rv-on .ladder[data-rv].rv-in .lane{opacity:1;transform:none;transition:none}
  html.rv-on .ladder[data-rv] .lane-track>i,html.rv-on .ladder[data-rv].rv-in .lane-track>i{transform:scaleX(1);transition:none}
  .lane:hover{transform:none}
}
@media(max-width:560px){
  .lane{grid-template-columns:22px 26px minmax(0,1fr) auto;gap:9px;padding:8px 11px}
  .lane-track{display:none}
}

/* ---- the road module: the former hero rail, now a row of its own ---- */
.roadgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px}
.roadgrid .railgame{display:flex;flex-direction:column;gap:5px;padding:16px 16px 15px;text-decoration:none}
.roadgrid .railgame:hover,.roadgrid .railgame:focus-visible{transform:translateY(-3px);
  box-shadow:var(--sh-1);outline:none}

/* ---- club ticker: crests only, no card, no box ---- */
.tickwrap{position:relative;overflow:hidden;padding:6px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.tickrow{display:flex;align-items:center;gap:clamp(30px,5vw,74px);width:max-content;
  animation:tick-run var(--tick-dur,42s) linear infinite}
.tickwrap:hover .tickrow{animation-play-state:paused}
@keyframes tick-run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticklink{display:block;flex:0 0 auto;line-height:0;opacity:.82;
  transition:opacity .3s ease,transform .35s var(--ease-spring),filter .3s ease}
.ticklink:hover,.ticklink:focus-visible{opacity:1;transform:scale(1.16) translateY(-4px);outline:none}
.ticklink:focus-visible{filter:drop-shadow(0 0 0 2px var(--gold))}
.ticklink img,.ticklink svg{display:block;width:clamp(52px,6vw,78px);height:clamp(52px,6vw,78px);object-fit:contain}
@media(prefers-reduced-motion:reduce){
  .tickrow{animation:none;flex-wrap:wrap;width:auto;justify-content:center}
  .ticklink:hover{transform:none}
}

/* ================= THE LEAGUE MAP — the hero, and the whole hero =================
   Every colour is a token with a value in BOTH themes: light reads like a printed atlas (pale
   land over paler water, one mid-tone coastline doing the drawing), dark stays the broadcast
   look. Nothing here is a hard-coded hex, so the map can never end up a dark slab on a light
   page. */
.na-wrap{position:relative;min-height:clamp(440px,66vh,740px);overflow:hidden;
  background:radial-gradient(125% 95% at 50% 0%,var(--map-sea-1) 0%,var(--map-sea-2) 72%)}
.na-plot{position:absolute;inset:0}
.na-svg{position:absolute;inset:0;width:100%;height:100%;display:block;
  opacity:0;transform:scale(1.045);transition:opacity 1.5s ease .35s,transform 2.2s var(--ease-out) .35s;
  /* the geography itself fades in from the top, so the map has no edge to stop at — the crests
     are excluded from this mask, so a northern club never dims with it */
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.45) 7%,#000 17%);
          mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.45) 7%,#000 17%)}
.na-wrap.map-in .na-svg{opacity:1;transform:none}
/* every stroke is a whole pixel: below 1 the rasteriser can only alpha-blend it, and on a
   DPR-1 screen the line washes out to nothing */
.na-svg path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.na-land{fill:var(--map-land);stroke:var(--map-coast);stroke-width:1}
.na-bord{fill:none;stroke:var(--map-bord);stroke-width:1}
.na-lake{fill:var(--map-lake);stroke:var(--map-bord);stroke-width:1}
.na-pins{position:absolute;inset:0}
/* the declutter nudge is folded into left/top, not a custom property: transform cannot carry it,
   because calc(-50% + var(--n)) drops the var term and the pin silently snaps back */
.na-pin{position:absolute;display:block;line-height:0;text-decoration:none;z-index:2;isolation:isolate;
  transform:translate(-50%,-50%);
  transition:transform .32s var(--ease-spring),filter .3s ease,opacity .5s ease}
.na-pin:hover,.na-pin:focus-visible{z-index:3;outline:none;transform:translate(-50%,-50%) scale(1.22)}
/* crest alone — no disc, no plate, no three-letter tag */
.na-pin .crest,.na-pin img,.na-pin svg{width:var(--pin,54px);height:var(--pin,54px);object-fit:contain;
  position:relative;filter:drop-shadow(0 3px 7px rgba(0,0,0,.42));
  transition:filter .3s ease,transform .32s var(--ease-spring)}
/* the glow is the CLUB's colour, set per pin from the team record — Boston glows gold, Carolina
   red, San Jose teal. --gold is only the fallback for a club with no colour on file. */
.na-pin:hover .crest,.na-pin:hover img,.na-pin:hover svg,
.na-pin:focus-visible .crest,.na-pin:focus-visible img,.na-pin:focus-visible svg{
  filter:drop-shadow(0 0 5px var(--team,var(--gold))) drop-shadow(0 0 11px var(--team,var(--gold)))
         drop-shadow(0 3px 8px rgba(0,0,0,.5))}
/* a soft disc of the club's colour blooms behind the crest on hover */
.na-pin::before{content:"";position:absolute;left:50%;top:50%;width:var(--pin,54px);height:var(--pin,54px);
  transform:translate(-50%,-50%) scale(.5);border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,var(--team,var(--gold)) 0%,transparent 68%);
  transition:opacity .32s ease,transform .42s var(--ease-spring)}
.na-pin:hover::before,.na-pin:focus-visible::before{opacity:.42;transform:translate(-50%,-50%) scale(1.32)}

/* ---- the crest morph ----
   The clone flies on a fixed stage above everything. Two phases, two curves: ease-out into the
   centre so it arrives and settles, then a steep ease-in as it rushes the viewer — acceleration is
   what sells "coming toward you" rather than "getting bigger". */
.crest-stage{position:fixed;inset:0;z-index:9999;pointer-events:none;contain:layout paint}
.crest-fly{position:absolute;left:0;top:0;transform-origin:center center;will-change:transform,opacity;
  object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.crest-fly.fly-centre{transition:transform .15s cubic-bezier(.2,.7,.3,1),filter .15s ease;
  filter:drop-shadow(0 0 16px var(--tint,var(--gold))) drop-shadow(0 8px 26px rgba(0,0,0,.5))}
.crest-fly.fly-through{transition:transform .2s cubic-bezier(.62,0,.9,.2),opacity .12s ease .12s;
  opacity:0}
/* the page drops back and dims as the crest passes through it */
html.morphing #app{transform:scale(.965);opacity:.35;transform-origin:center 38vh;
  transition:transform .2s cubic-bezier(.62,0,.9,.2),opacity .18s ease}
/* the club page arrives already large and settles — as if we flew into it */
#app.morph-in{animation:morph-arrive .24s cubic-bezier(.16,.85,.3,1) both}
@keyframes morph-arrive{from{opacity:0;transform:scale(1.14)}to{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){
  .na-pin::before{display:none}
  .crest-stage{display:none}
  html.morphing #app,#app.morph-in{transform:none;opacity:1;animation:none;transition:none}
  .na-wrap.pin-zooming .na-svg,.na-wrap.pin-zooming .na-pin:not(.pin-zoom),
  .na-pin.pin-zoom .crest,.na-pin.pin-zoom img,.na-pin.pin-zoom svg{transition:none;transform:none;
    opacity:1;filter:none}
}
/* the crests arrive one after another once the continent has settled */
html.rv-on .na-wrap .na-pin{opacity:0;transform:translate(-50%,-50%) scale(.55)}
html.rv-on .na-wrap.pins-in .na-pin{opacity:1;transform:translate(-50%,-50%) scale(1);
  transition:opacity .5s ease calc(var(--pin-i,0)*80ms),transform .7s var(--ease-spring) calc(var(--pin-i,0)*80ms)}

/* ---- the wordmark that opens the page, sitting above the map ---- */
.hero-name{position:relative;z-index:3;text-align:center;padding:clamp(26px,5vh,58px) 20px clamp(14px,2.6vh,26px)}
.hero-name h1{font-family:var(--f-disp);font-weight:900;color:var(--ink);
  font-size:clamp(44px,11vw,148px);line-height:.86;letter-spacing:-.035em;text-transform:uppercase}
.hero-name .hn-sub{display:block;margin-top:clamp(10px,1.6vh,18px);font-family:var(--f-mono);
  font-size:clamp(10px,1.1vw,13px);letter-spacing:.42em;text-transform:uppercase;color:var(--steel)}
.na-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 26px 20px;pointer-events:none;
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  background:linear-gradient(to top,var(--map-sea-2),transparent)}
.na-cap-h{font-family:var(--f-disp);font-size:clamp(15px,1.7vw,21px);color:var(--ink);text-transform:uppercase}
.na-cap-s{font-size:13px;line-height:1.45;color:var(--steel)}
@media(max-width:720px){
  .na-wrap{min-height:clamp(330px,46vh,440px)}
  /* the crest shrinks but the tap target does not: 3px of padding keeps the hit area at 44px,
     which is the floor for a control this important — the crests ARE the navigation here */
  .na-pin{padding:3px}
  .na-pin .crest,.na-pin img,.na-pin svg{--pin:38px}
  .na-cap{padding:14px 16px 16px}
  .na-cap-s{display:none}
  /* a horizontal slide on a full-width card pokes off the edge of a phone; rise instead */
  html.rv-on [data-rv="slide"],html.rv-on [data-rv="slide-r"]{transform:translateY(26px)}
  /* inline section links are real controls — give them the 44px they need to be tapped */
  .sec-link{min-height:44px;display:inline-flex;align-items:center}
  .caro-btn{width:44px;height:44px}
}

.caro-track{display:grid;height:100%}
.slide{grid-area:1/1;padding:clamp(26px,4vw,58px) clamp(4px,3vw,40px) clamp(64px,5vw,74px) 0;
  opacity:0;visibility:hidden;transform:translateX(28px);transition:opacity .5s ease,transform .5s ease,visibility .5s}
.slide.on{opacity:1;visibility:visible;transform:none}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .3s;transform:none}}
.slide .s-cat{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px}
.slide h2{font-size:clamp(30px,4vw,52px);font-weight:900;letter-spacing:-.03em;line-height:1;color:#fff;max-width:16ch}
.slide .s-dek{margin-top:14px;font-size:15.5px;color:var(--on-ink-dim);max-width:52ch;line-height:1.55}
.slide .s-cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.slide .s-date{display:block;margin-top:20px;font-family:var(--f-mono);font-size:11px;color:var(--on-ink-dim);letter-spacing:.08em}
.caro-ctl{position:absolute;bottom:18px;right:0;display:flex;gap:8px;align-items:center}
.caro-btn{width:40px;height:40px;border-radius:var(--r-s);border:1.5px solid #39434B;display:grid;place-items:center;color:var(--on-ink)}
.caro-btn:hover{border-color:var(--chrome);color:var(--chrome)}
.caro-dots{display:flex;gap:6px;margin-right:10px}
.caro-dots button{position:relative;width:22px;height:4px;border-radius:2px;background:#39434B;transition:background .2s;min-height:0;padding:0}
/* the visible indicator stays a 4px bar, but the tap target is expanded to a real ~28px
   touch area so it is usable on a phone (the bar alone was untappable). */
.caro-dots button::before{content:"";position:absolute;inset:-13px -5px}
.caro-dots button.on{background:var(--chrome)}
.caro-dots button:focus-visible{outline-offset:4px}
.hero-rail{border-left:1px solid #2A343B;padding:26px 0 26px 26px;display:flex;flex-direction:column;gap:12px}
.hero-rail .rail-h{display:flex;justify-content:space-between;align-items:center}
/* These were styled for the dark hero rail that no longer exists. Retheming them at the source
   rather than overriding downstream: the old rules sat later in the file at equal specificity, so
   an override in the new module's block silently lost and the text stayed a fixed dim grey that
   fails contrast on a light page. */
.railgame{border:1px solid var(--glass-line,var(--line));border-radius:var(--r-m);background:var(--glass,var(--paper));
  -webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);
  cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .25s ease}
.railgame:hover{border-color:var(--viz-accent)}
.railgame .rg-line{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:700;
  font-size:14.5px;color:var(--ink)}
.railgame .rg-meta{font-family:var(--f-mono);font-size:11px;color:var(--steel);letter-spacing:.05em}
.railgame .rg-t{font-family:var(--f-mono);font-size:11.5px;color:var(--amber-ink)}

/* ---------- module blocks / stats ---------- */
/* season roadmap — the track reads like a rink line: pucks for stops, chrome fill for progress */
.szn-tl{position:relative;display:grid;gap:0 18px;padding-top:4px}
.szn-tl::before{content:"";position:absolute;left:8px;right:8px;top:11px;height:2px;background:var(--line)}
.szn-fill{position:absolute;left:8px;top:11px;height:2px;background:var(--chrome)}
.szn-stop{position:relative;min-width:0;padding-top:0}
.szn-node{position:relative;display:block;width:16px;height:16px;border-radius:50%;
  background:var(--ice);border:2px solid var(--steel-2);margin-bottom:14px;z-index:1}
.szn-stop.done .szn-node{background:var(--ink);border-color:var(--ink)}
.szn-stop.now .szn-node{background:var(--chrome);border-color:var(--ink);box-shadow:0 0 0 5px color-mix(in srgb, var(--chrome) 30%, transparent)}
.szn-date{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--steel);margin-bottom:5px;white-space:nowrap}
.szn-stop.now .szn-date{color:var(--ink);font-weight:700}
.szn-name{display:block;font-family:var(--f-disp);font-weight:800;font-size:15.5px;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.szn-stop.done .szn-name{color:var(--steel)}
.szn-desc{font-size:12.5px;line-height:1.55;color:var(--steel);margin-top:6px;max-width:24ch}
.szn-chip{display:inline-block;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--chrome);color:#101519;padding:2px 8px;border-radius:99px;margin-top:8px;font-weight:700}
.szn-week{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;margin-top:6px;border-bottom:2.5px solid var(--chrome);padding-bottom:2px;
  font-variant-numeric:tabular-nums}
.szn-week span{color:var(--steel);font-weight:400}
/* draft desk: the clock reads like a scoreboard; the live pick row breathes chrome */
.dr-clock{font-family:var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.01em}
tr.dr-now{background:var(--chrome-tint);box-shadow:inset 3px 0 0 var(--chrome)}
tr.dr-now td{animation:drGlow 2.2s ease-in-out infinite}
@keyframes drGlow{0%,100%{background:transparent}50%{background:color-mix(in srgb, var(--chrome) 9%, transparent)}}
@media(prefers-reduced-motion:reduce){ tr.dr-now td{animation:none} }
@media(max-width:860px){
  .szn-tl{grid-template-columns:1fr!important;gap:0}
  .szn-tl::before{left:7px;right:auto;top:12px;bottom:10px;width:2px;height:auto}
  .szn-fill{left:7px;top:12px;width:2px!important;height:var(--fillv,0%)}
  .szn-stop{display:grid;grid-template-columns:16px 1fr;gap:0 16px;padding-bottom:26px}
  .szn-stop:last-child{padding-bottom:4px}
  .szn-node{margin-bottom:0;grid-row:1 / span 3}
  .szn-date{grid-column:2}
  .szn-name{grid-column:2}
  .szn-desc{grid-column:2;max-width:52ch}
  .szn-chip{grid-column:2;justify-self:start}
  .szn-week{grid-column:2;justify-self:start}
}
.statline{display:flex;gap:0;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--line)}
.statline>div{padding:14px 22px 14px 0;margin-right:22px;border-right:1px solid var(--line)}
.statline>div:last-child{border-right:0}
.statline b{display:block;font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:-.02em}
.statline span{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.leaderrow{display:grid;grid-template-columns:24px auto 1fr auto;gap:12px;align-items:center;padding:12px 18px;
  border-top:1px solid var(--line-soft);cursor:pointer;transition:background .12s}
.leaderrow:hover{background:var(--ice)}
.leaderrow .rk{font-family:var(--f-disp);font-weight:800;font-size:17px;color:var(--steel-2)}
.leaderrow.top .rk{color:var(--ink)}
.leaderrow .val{text-align:right}
.leaderrow .val b{font-family:var(--f-disp);font-weight:800;font-size:19px}
.leaderrow .val span{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;color:var(--steel);text-transform:uppercase}
.ovrbox{display:inline-grid;place-items:center;min-width:40px;height:30px;border-radius:7px;
  font-family:var(--f-disp);font-weight:800;font-size:15px;background:var(--bc);color:var(--chrome);padding:0 7px}
.ovrbox.mid{background:var(--bc3)} .ovrbox.low{background:#5C6B75}
.gamecard{display:grid;grid-template-columns:74px 1fr auto;gap:16px;align-items:center;background:var(--paper);
  border:1.5px solid var(--line);border-radius:var(--r-m);padding:14px 18px;cursor:pointer;
  transition:transform .15s,border-color .15s,box-shadow .15s}
.gamecard:hover{border-color:var(--ink);transform:translateX(3px);box-shadow:var(--sh-1)}
/* the when-track holds day / date / time stacked in a fixed 74px column, so it drives the card's
   height — stretch the rule and centre the stack rather than widening the track */
.gamecard .gc-when{border-right:1px solid var(--line);padding-right:14px;align-self:stretch;
  display:flex;flex-direction:column;justify-content:center}
.gamecard .gc-when b{font-family:var(--f-disp);font-weight:800;font-size:14px;display:block;line-height:1.2}
.gamecard .gc-when span{display:block;font-family:var(--f-mono);font-size:10.5px;line-height:1.35;color:var(--steel)}
.gamecard .gc-match{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:700;font-size:14.5px;flex-wrap:wrap}
.gamecard .gc-match .at{font-family:var(--f-mono);font-size:10px;color:var(--steel);margin:0 2px}
.gamecard .gc-score{font-family:var(--f-disp);font-weight:900;font-size:19px;letter-spacing:.02em}
.gamecard .gc-tag{justify-self:end}
/* three stories abreast, in the height the single-slide carousel used for one */
.newsrow{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:16px;align-items:stretch}
.newsrow>div{display:flex}
.newsrow .newscard{flex:1}
@media(max-width:900px){.newsrow{grid-template-columns:1fr;gap:12px}}

/* A card brings its own background, so it must bring its own text colour — inheriting from a
   dark section band put near-white type on a white card (1.11:1) the moment the news carousel
   was replaced with these. */
.newscard{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);
  border:1.5px solid var(--line);
  border-radius:var(--r-m);overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.newscard:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--ink)}
.newscard .nc-art{height:140px;position:relative;overflow:hidden;background:var(--bc)}
.newscard .nc-b{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1;gap:8px}
.newscard .eyebrow{color:var(--steel)}
.newscard h3{font-size:17px;font-weight:800;letter-spacing:-.015em;line-height:1.2;color:var(--ink)}
.newscard.lead h3{font-size:22px}
.newscard p{color:var(--steel);font-size:13.5px;line-height:1.5}
.newscard .nc-meta{margin-top:auto;padding-top:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--steel);letter-spacing:.05em}
/* Feature band — the lead story spans the full row: art left, headline + excerpt right. */
.newscard.feature{flex-direction:row;align-items:stretch}
.newscard.feature .nc-art{height:auto;flex:0 0 46%;min-height:260px}
.newscard.feature .nc-b{justify-content:center;padding:30px 34px;gap:10px}
.newscard.feature h3{font-size:clamp(23px,3vw,32px);letter-spacing:-.02em;line-height:1.12}
.newscard.feature p{font-size:15px;line-height:1.55;color:var(--ink-3);max-width:54ch}
.newscard.feature .nc-flag{position:absolute;top:14px;left:14px;font-family:var(--f-mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;background:var(--chrome);color:#0b0e11;padding:4px 9px;border-radius:999px;font-weight:700}
@media(max-width:640px){.newscard.feature{flex-direction:column}.newscard.feature .nc-art{flex:none;min-height:160px}.newscard.feature .nc-b{padding:20px}}

/* ---------- tabs / filters ---------- */
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--ink);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 15px;font-family:var(--f-disp);font-weight:700;font-size:13.5px;color:var(--steel);
  position:relative;white-space:nowrap;min-height:44px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1.5px;height:3.5px;background:var(--chrome)}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.filters select,.filters input[type=search],.filters input[type=text]{min-height:40px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--paper)}
.seg button{padding:8px 13px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;color:var(--steel);min-height:40px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--bc);color:var(--chrome);font-weight:600}

/* ---------- forms ---------- */
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--r-s);padding:10px 12px;width:100%;transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:var(--steel-2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--steel-2)}
label.fld{display:block;margin-bottom:14px}
label.fld>span{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--steel);margin-bottom:6px;font-weight:600}
.fld .hint{font-size:12px;color:var(--steel);margin-top:5px}
.fld .err{font-size:12.5px;color:var(--red-ink);margin-top:5px;font-weight:500}
.logo-drop{display:flex;align-items:center;justify-content:center;gap:12px;min-height:96px;padding:14px;
  border:1.5px dashed var(--line);border-radius:var(--r-s);background:var(--paper);cursor:pointer;
  text-align:center;transition:border-color .15s,background .15s}
.logo-drop:hover{border-color:var(--ink)}
.logo-drop.drag{border-color:var(--chrome-deep);background:var(--chrome-tint)}
.logo-drop.busy{opacity:.6;pointer-events:none}
.logo-drop .lp-hint{font-size:12.5px;color:var(--steel);max-width:34ch}
.logo-drop img{max-height:64px;max-width:120px;object-fit:contain}
/* A tier's mark. The TIER n plate is always rendered and the emblem is laid over it, so an
   emblem that fails to load (its storage object deleted) reveals the plate underneath instead of
   a broken-image icon — the fallback is structural, not wired to a load event. */
.tier-mark,.lg-emblem{position:relative;flex:0 0 auto;overflow:hidden;border-radius:var(--r-s)}
.tier-mark{width:46px;height:46px}
.lg-emblem{width:56px;height:56px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.tier-plate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--bc);color:var(--on-ink)}
.tier-plate .tp-label{font-family:var(--f-mono);font-size:7.5px;letter-spacing:.12em;opacity:.7}
.tier-plate .tp-num{font-family:var(--f-disp);line-height:1}
.tier-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px;
  background:var(--paper)}
/* the Control Center plate is also the drop target — say so on hover/focus */
.lg-emblem:hover,.lg-emblem:focus-visible{box-shadow:0 0 0 2px var(--chrome);outline:none}
.lg-emblem.drag{box-shadow:0 0 0 2px var(--chrome-deep);transform:scale(1.04)}
.lg-emblem.busy{opacity:.55;pointer-events:none}
.lg-emblem-hint{position:absolute;inset:auto 0 0 0;z-index:2;font-family:var(--f-mono);font-size:7.5px;
  letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:2px 0;
  background:rgba(0,0,0,.72);color:#fff;opacity:0;transition:opacity .15s}
.lg-emblem:hover .lg-emblem-hint,.lg-emblem:focus-visible .lg-emblem-hint,
.lg-emblem.busy .lg-emblem-hint{opacity:1}
.fld.invalid input,.fld.invalid select,.fld.invalid textarea{border-color:var(--red)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;padding:6px 0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--ink);flex-shrink:0}
.radio-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}
.radio-cards label{border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px 12px;cursor:pointer;
  font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center;background:var(--paper);min-height:44px}
.radio-cards label:hover{border-color:var(--steel)}
.radio-cards input{display:none}
.radio-cards label.on{border-color:var(--ink);background:var(--chrome-tint)}
.toggle{position:relative;width:44px;height:24px;border-radius:100px;background:var(--line);transition:background .18s;flex-shrink:0}
.toggle.on{background:var(--ink)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on::after{left:23px}
html[data-theme="dark"] .toggle.on{background:var(--chrome)}
html[data-theme="dark"] .toggle.on::after{background:#101519}

/* ---------- entity autocomplete ---------- */
.ac-menu{position:absolute;background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r-m);
  box-shadow:var(--sh-2);z-index:120;max-height:300px;overflow-y:auto}
.ac-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 13px;font-size:13.5px;min-height:44px}
.ac-item.on,.ac-item:hover{background:var(--ice)}
.ac-item b{font-weight:600}
.ac-item small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--steel)}
.ac-item mark{background:var(--chrome);color:#101519;border-radius:2px;padding:0 1px}
input.ac-ok{border-color:var(--green) !important;background:var(--green-tint)}

/* ---------- notices / states ---------- */
.note{border:1.5px solid var(--line);border-left:4px solid var(--steel);background:var(--paper);
  border-radius:var(--r-s);padding:13px 16px;font-size:13.5px;color:var(--steel)}
.note.chr{border-left-color:var(--chrome);color:var(--ink)}
.note.red{border-left-color:var(--red)} .note.grn{border-left-color:var(--green)}
.empty{padding:40px 24px;text-align:center;color:var(--steel)}
.empty .e-art{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:2px dashed var(--line);
  display:grid;place-items:center;color:var(--steel-2)}
.empty b{display:block;font-family:var(--f-disp);font-weight:800;font-size:16px;color:var(--ink);margin-bottom:4px}
.empty p{font-size:13.5px;max-width:40ch;margin:0 auto}
.skel{position:relative;overflow:hidden;background:var(--line-soft);border-radius:6px;min-height:14px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:sk 1.2s infinite}
@keyframes sk{to{transform:translateX(100%)}}
.lock{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12px;color:var(--steel)}

/* ---------- page transitions ---------- */
.pg{animation:pgin .38s cubic-bezier(.16,1,.3,1) both}
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pg{animation:none}}

/* ---------- hub / admin layout ---------- */
.hub-grid{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start}
.hub-side{position:sticky;top:calc(var(--nav-h) + 18px);display:flex;flex-direction:column;gap:2px}
.hub-side .hs-group{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--steel-2);padding:14px 10px 5px}
.hub-side a{padding:8px 10px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--steel);
  display:flex;align-items:center;gap:9px;min-height:36px}
.hub-side a:hover{color:var(--ink);background:var(--paper)}
.hub-side a.on{background:var(--bc);color:#fff}
.hub-side a.on .hs-n{background:var(--chrome);color:#101519}
.hub-side .hs-n{margin-left:auto;font-family:var(--f-mono);font-size:10px;background:var(--line);
  border-radius:100px;padding:1px 7px;color:var(--ink)}
.kpi{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-m);padding:16px 18px;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--ink)}
.kpi b{display:block;font-family:var(--f-disp);font-weight:900;font-size:30px;letter-spacing:-.02em}
.kpi span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
.kpi.alert{border-color:var(--red);background:var(--red-tint)}
.kpi.ok{border-color:#BFE3CE}
.tasklist .titem{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line-soft);font-size:14px}
.tasklist .titem:first-child{border-top:0}
.tasklist .t-dot{width:9px;height:9px;border-radius:50%;background:var(--chrome-deep);flex-shrink:0}
.tasklist .t-dot.red{background:var(--red)} .tasklist .t-dot.grn{background:var(--green)}

/* ---------- lineup builder ---------- */
.rink{background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r-l);padding:24px;position:relative}
.rink .rk-rows{display:flex;flex-direction:column;gap:14px}
.rk-line{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rk-line.d2{grid-template-columns:1fr 1fr;max-width:66%;margin:0 auto}
.rk-line.g1{grid-template-columns:1fr;max-width:33%;margin:0 auto}
.slot{border:2px dashed var(--line);border-radius:var(--r-m);padding:12px;min-height:86px;text-align:center;
  transition:border-color .15s,background .15s;cursor:pointer;background:var(--ice)}
.slot:hover{border-color:var(--steel)}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--paper)}
.slot.target{border-color:var(--chrome-deep);background:var(--chrome-tint)}
.slot .sl-pos{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--steel);text-transform:uppercase}
.slot .sl-name{font-family:var(--f-disp);font-weight:700;font-size:14px;margin-top:5px}
.slot .sl-sub{font-family:var(--f-mono);font-size:10px;color:var(--steel);margin-top:2px}
.bench{display:flex;flex-direction:column;gap:8px}
.bench .bp{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:var(--r-s);
  padding:9px 12px;background:var(--paper);cursor:grab;transition:border-color .12s;min-height:44px}
.bench .bp:hover{border-color:var(--ink)}
.bench .bp.sel{border-color:var(--chrome-deep);background:var(--chrome-tint)}
.bench .bp.dis{opacity:.45;cursor:not-allowed}
.bench .bp .bp-meta{margin-left:auto;text-align:right;font-family:var(--f-mono);font-size:10.5px;color:var(--steel)}

/* ---------- availability ---------- */
.avgrid{display:grid;gap:8px}
.av-opt{display:flex;gap:8px;flex-wrap:wrap}
.av-opt button{border:1.5px solid var(--line);border-radius:100px;padding:8px 14px;font-size:13px;font-weight:600;
  background:var(--paper);min-height:40px}
.av-opt button:hover{border-color:var(--ink)}
.av-opt button.on{background:var(--ink);color:var(--ice);border-color:var(--ink)}
/* these two pin their own foreground: --ice flips with the theme and cannot clear AA on a fill
   that does not flip with it */
.av-opt button.on.yes{background:var(--green);border-color:var(--green);color:#101519}
.av-opt button.on.no{background:var(--red);border-color:var(--red);color:#fff}
.avcell{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;
  font-family:var(--f-mono);font-size:11px;font-weight:600}
.avcell.yes{background:var(--green-tint);color:var(--green-ink)}
.avcell.no{background:var(--red-tint);color:var(--red-ink)}
.avcell.mb{background:var(--chrome-tint);color:var(--amber-ink)}
.avcell.nr{background:var(--line-soft);color:var(--steel)}

/* ---------- matchup ---------- */
.mx-hero{background:var(--bc);color:var(--on-ink);border-radius:var(--r-l);padding:clamp(22px,3.4vw,40px);position:relative;overflow:hidden}
.mx-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
.mx-side{display:flex;align-items:center;gap:16px;min-width:0}
.mx-side.away{flex-direction:row-reverse;text-align:right}
.mx-side .mx-nm{font-family:var(--f-disp);font-weight:900;font-size:clamp(18px,2.6vw,30px);letter-spacing:-.02em;color:#fff}
.mx-side .mx-rec{font-family:var(--f-mono);font-size:11.5px;color:var(--on-ink-dim);margin-top:3px}
.mx-mid{text-align:center}
.mx-mid .mx-score{font-family:var(--f-disp);font-weight:900;font-size:clamp(30px,4.5vw,52px);letter-spacing:.01em;color:#fff}
.mx-mid .mx-t{font-family:var(--f-mono);font-size:11px;color:var(--on-ink-dim);letter-spacing:.1em;text-transform:uppercase}
.codebox{border:1.5px dashed #39434B;border-radius:var(--r-m);padding:16px 18px;text-align:center;background:var(--bc2)}
.codebox .cb-code{font-family:var(--f-mono);font-weight:600;font-size:24px;letter-spacing:.22em;color:var(--chrome)}
.codebox.locked .cb-code{color:var(--on-ink-dim);letter-spacing:.1em;font-size:15px}
.starsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.starcard{border:1.5px solid var(--line);border-radius:var(--r-m);padding:14px 16px;background:var(--paper);position:relative}
.starcard .st-k{position:absolute;top:-11px;left:14px;background:var(--chrome);color:#101519;
  font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;padding:2px 9px;border-radius:100px}

/* ---------- search palette ---------- */
#palette{position:fixed;inset:0;z-index:120;display:none}
#palette.open{display:block}
#palette .pal-bg{position:absolute;inset:0;background:rgba(16,21,25,.5)}
#palette .pal{position:relative;max-width:640px;margin:9vh auto 0;background:var(--paper);border:2px solid var(--ink);
  border-radius:var(--r-l);box-shadow:var(--sh-2);overflow:hidden}
#palette input{border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:17px 20px;font-size:16px}
#palette input:focus{border-color:var(--line)}
.pal-res{max-height:52vh;overflow-y:auto;padding:8px}
.pal-group{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel-2);padding:10px 12px 4px}
.pal-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-s);font-size:14px;min-height:44px}
.pal-item.on,.pal-item:hover{background:var(--ice)}
.pal-item .pi-meta{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--steel-2)}
.pal-item mark{background:var(--chrome);color:#101519;border-radius:2px;padding:0 1px}
.pal-foot{border-top:1px solid var(--line);padding:9px 16px;display:flex;gap:16px;font-family:var(--f-mono);font-size:10.5px;color:var(--steel-2)}
.pal-foot kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--ice)}

/* ---------- modal / drawer / toast ---------- */
#overlay-root .ov-bg{position:fixed;inset:0;background:rgba(16,21,25,.5);z-index:110;animation:fadein .2s both}
@keyframes fadein{from{opacity:0}}
.modal{position:fixed;z-index:111;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));
  max-height:86vh;overflow-y:auto;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r-l);
  box-shadow:var(--sh-2);animation:popin .22s cubic-bezier(.16,1,.3,1) both}
@keyframes popin{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}}
.modal .mo-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1.5px solid var(--line)}
.modal .mo-h h3{font-size:17px;font-weight:800}
.modal .mo-b{padding:22px}
.modal .mo-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);background:var(--ice);border-radius:0 0 var(--r-l) var(--r-l)}
.drawer{position:fixed;z-index:111;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--paper);
  border-left:2px solid var(--ink);box-shadow:var(--sh-2);animation:slidein .26s cubic-bezier(.16,1,.3,1) both;
  display:flex;flex-direction:column}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.drawer .dr-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1.5px solid var(--line)}
.drawer .dr-b{flex:1;overflow-y:auto;padding:16px 20px}
@media(prefers-reduced-motion:reduce){.modal,.drawer,#overlay-root .ov-bg{animation:none}}
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:130;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--bc);color:var(--on-ink);border-left:4px solid var(--chrome);border-radius:var(--r-s);
  padding:12px 18px;font-size:14px;font-weight:500;box-shadow:var(--sh-2);display:flex;gap:10px;align-items:center;
  animation:toastin .25s cubic-bezier(.16,1,.3,1) both;max-width:min(480px,90vw)}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}}
.toast.err{border-left-color:var(--red)} .toast.ok{border-left-color:var(--green)}

/* ---------- notification panel items ---------- */
.notif{display:flex;gap:12px;padding:13px 16px;border-top:1px solid var(--line-soft);cursor:pointer;align-items:flex-start}
.notif:hover{background:var(--ice)}
.notif.unread{background:var(--chrome-tint)}
.notif .nf-ic{width:34px;height:34px;border-radius:9px;background:var(--ice);border:1px solid var(--line);
  display:grid;place-items:center;flex-shrink:0;color:var(--steel)}
.notif .nf-ic svg{width:16px;height:16px}
.notif b{font-size:13.5px;display:block}
.notif p{font-size:12.5px;color:var(--steel);margin-top:1px}
.notif .nf-t{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--steel-2);white-space:nowrap;flex-shrink:0}

/* ---------- ratings bars ---------- */
.rbar{display:grid;grid-template-columns:120px 1fr 40px;gap:12px;align-items:center;font-size:12.5px;padding:6px 0}
.rbar .rb-lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
.rbar .rb-track{height:9px;border-radius:6px;background:var(--line);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.16)}
.rbar .rb-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ink),var(--steel-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.rbar .rb-v{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- data-viz (radar + radial gauges) ----------
   All colours come from the flipping design tokens so every chart adapts to light + dark. */
.viz-card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-m);padding:16px 18px}
.viz-card .vch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.viz-card .vch h4{font-family:var(--f-disp);font-weight:800;font-size:14px;margin:0}
.viz-card .vch .vsub{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.vradar{display:block;margin:0 auto;max-width:340px;width:100%;height:auto}
.vradar text{fill:var(--steel);font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.05em}
.vradar .vr-grid{fill:none;stroke:var(--line)}
.vradar .vr-spoke{stroke:var(--line)}
.vradar .vr-surface{fill:var(--ice)}
.vradar .vr-dot{filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.vlegend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;color:var(--steel)}
.vlegend i{width:10px;height:10px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:6px}
.vgauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:16px 12px;justify-items:center}
.vgauge{text-align:center}
.vgauge svg{display:block;margin:0 auto;overflow:visible}
.vgauge .vgt{stroke:var(--line)}
.vgauge .vgv{font-family:var(--f-disp);font-weight:800;font-size:18px;fill:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vgauge .vgl{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-top:5px}
  /* clickable 3D team logo — the real crest itself, tilted in perspective. No plate, ring or backdrop. */
  .crest3d{display:inline-block;perspective:820px;flex-shrink:0;text-decoration:none;line-height:0;animation:c3d-in .5s ease both}
  @keyframes c3d-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .crest3d .crest{transform-style:preserve-3d;transform:rotateX(7deg) rotateY(-15deg);
    transition:transform .55s cubic-bezier(.2,.8,.3,1),filter .55s ease;will-change:transform;
    filter:drop-shadow(-7px 11px 11px rgba(0,0,0,.5)) drop-shadow(0 2px 2px rgba(0,0,0,.42))}
  .crest3d:hover .crest,.crest3d:focus-visible .crest{transform:rotateX(5deg) rotateY(13deg) scale(1.05);
    filter:drop-shadow(9px 13px 15px rgba(0,0,0,.55)) drop-shadow(0 2px 3px rgba(0,0,0,.42))}
  .crest3d:focus-visible{outline:2px solid var(--chrome);outline-offset:5px;border-radius:8px}
  /* stat-viz load animations (respect reduced-motion) */
  .vgauge .varc{animation:viz-arc 1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes viz-arc{from{stroke-dashoffset:var(--varc-len,0)}to{stroke-dashoffset:0}}
  .rbar .rb-fill{animation:viz-grow-w .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes viz-grow-w{from{width:0}}
  .viz-card{animation:viz-up .5s ease both}
  @keyframes viz-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.crest3d,.vgauge .varc,.rbar .rb-fill,.viz-card{animation:none}
    .crest3d .crest{transition:none} .viz-card{transform:none}}

/* ---------- video module ---------- */
.vidbox{position:relative;border-radius:var(--r-l);overflow:hidden;background:var(--bc);border:1.5px solid var(--bc);min-height:280px;display:grid}
.vidbox video,.vidbox .vb-poster{width:100%;height:100%;object-fit:cover;grid-area:1/1}
.vidbox .vb-overlay{grid-area:1/1;z-index:2;align-self:end;padding:20px 24px;color:#fff;
  background:linear-gradient(transparent,rgba(16,21,25,.85))}
.vidbox .vb-fallback{grid-area:1/1;display:grid;place-items:center;color:var(--on-ink-dim);padding:40px}

/* ---------- footer ---------- */
footer.site{background:var(--bc);color:var(--on-ink-dim);margin-top:48px}
footer.site .ft-top{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:30px;padding:48px 0 36px}
footer.site h4{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-ink-dim);margin:0 0 12px;font-weight:600}
footer.site a.fl{display:block;padding:5px 0;font-size:13.5px;color:var(--on-ink)}
footer.site a.fl:hover{color:var(--chrome)}
footer.site .ft-base{border-top:1px solid #2A343B;padding:18px 0;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px}
.protopill{display:inline-flex;align-items:center;gap:7px;border:1px solid #39434B;border-radius:100px;padding:4px 12px;color:var(--chrome);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em}

/* ---------- print (rulebook) ---------- */
@media print{
  #demobar,#ticker,#masthead,footer.site,.no-print{display:none !important}
  body{background:#fff}
  .card{border:1px solid #999;break-inside:avoid}
}

/* ---------- responsive ---------- */
@media(max-width:1100px){
  .mh-nav{display:none}
  .mh-burger{display:grid}
  .hero-grid{grid-template-columns:1fr}
  .hero-rail{border-left:0;border-top:1px solid #2A343B;padding-left:0}
  .g4{grid-template-columns:1fr 1fr}
  .g23,.g32,.g5x7{grid-template-columns:1fr}
  .hub-grid{grid-template-columns:1fr}
  .hub-side{position:static;flex-direction:row;flex-wrap:wrap;gap:6px;padding-bottom:6px}
  .hub-side .hs-group{display:none}
  .hub-side a{border:1.5px solid var(--line);background:var(--paper)}
  .starsrow{grid-template-columns:1fr}
}
@media(max-width:720px){
  .shell{padding:0 16px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  #demobar{height:auto;padding:6px 0}
  #demobar .shell{flex-wrap:wrap;row-gap:2px}
  #demobar .db-roles{margin-left:0;flex-wrap:wrap}
  .seasel{display:none}
  .statline{flex-wrap:wrap}
  .statline>div{padding:12px 14px 12px 0;margin-right:14px;border-right:0}
  #demobar .db-lab2{display:none}
  .caro{min-height:400px}
  /* the map keeps the full width on a phone; the caption drops out of the plot box so it stops
     taking a third of the height the map is being framed into */
  .na-wrap{display:flex;flex-direction:column}
  .na-plot{position:relative;inset:auto;flex:1 1 auto;min-height:250px}
  .na-cap{position:static;padding:4px 16px 14px;background:none}
  .slide h2{font-size:29px}
  .mx-teams{grid-template-columns:1fr;text-align:center}
  .mx-side,.mx-side.away{flex-direction:column;text-align:center;justify-items:center}
  .rk-line{grid-template-columns:1fr}
  .rk-line.d2,.rk-line.g1{max-width:100%}
  .gamecard{grid-template-columns:60px 1fr}
  .gamecard .gc-when{padding-right:10px}
  .gamecard .gc-tag{display:none}
  footer.site .ft-top{grid-template-columns:1fr 1fr}
  /* Column hiding is a LAST resort: it makes the hidden data unreachable and unsortable.
     Keep it only for tables that carry a compact summary (standings). Stat-dense tables opt
     out with .keepcols and scroll horizontally inside .tblwrap instead, so phones can still
     reach S%, TK, GV, GWG, TOI/GP — the whole point of Stat Central. */
  .tbl th:nth-child(n+7):not(:last-child),.tbl td:nth-child(n+7):not(:last-child){display:none}
  .tbl.keepcols th,.tbl.keepcols td{display:table-cell}
  /* No min-width: .tblwrap already scrolls when the table's natural width exceeds the
     viewport, so forcing a width only made empty tables overflow for no reason. */
  /* scroll affordance: the wrap is scrollable but scrollbars are hidden on iOS */
  .tblwrap{position:relative}
  .tblwrap:after{content:"";position:absolute;top:0;right:0;bottom:0;width:26px;pointer-events:none;
    background:linear-gradient(90deg,transparent,var(--paper))}
}
@media(max-width:430px){
  footer.site .ft-top{grid-template-columns:1fr}
  .avcell{width:26px;height:26px}
  /* Player/team hero: the middle block had min-width:0 so a long unbreakable gamertag
     overflowed its shrunken flex item straight under the OVR badge ("ZACKBRO|7") instead of
     wrapping the row. Give it a real floor so flex-wrap actually wraps, shrink the crest, and
     let the OVR badge sit inline underneath rather than fighting for the same line. */
  .hero-row{gap:14px !important}
  .hero-row .hero-main{min-width:min(100%,240px) !important;flex:1 1 100% !important}
  .hero-row .hero-crest{width:64px !important;height:68px !important}
  .hero-row .hero-ovr{text-align:left !important;flex:0 0 auto}
  .hero-row .hero-ovr .ovrbox{min-width:48px !important;height:40px !important;font-size:20px !important}
}
/* iOS Safari zooms the viewport when a focused control is under 16px and never zooms back.
   body is 15.5px and controls inherit it, so every search box, filter select, and form field
   on the site triggered it. 15.5 -> 16 is imperceptible; the zoom was not. */
@media(max-width:560px){
  input,select,textarea{font-size:16px}
  /* touch-target floor: btn-sm is 36px, so small CTAs — including the registration deadline
     bar, the single most-important conversion button for phone visitors from Discord — sat
     under the 44px minimum. Pad them up on touch widths without disturbing desktop. */
  .btn-sm{min-height:44px;padding-top:10px;padding-bottom:10px}
}

/* mobile menu */
#mobilenav{position:fixed;inset:0;z-index:100;background:var(--bc);color:var(--on-ink);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:20px 22px 44px}
#mobilenav.open{transform:none}
@media(prefers-reduced-motion:reduce){#mobilenav{transition:none}}
#mobilenav .mn-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#mobilenav .mn-g{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-ink-dim);padding:18px 0 6px}
#mobilenav a{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid #232B31;
  font-family:var(--f-disp);font-weight:700;font-size:17px;color:var(--on-ink);min-height:48px}
#mobilenav a:active{color:var(--chrome)}

/* Admin "View as…" floating toolbar (see CG.renderViewAsBar) */
#cgViewAs{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:120;
  max-width:calc(100vw - 24px)}
#cgViewAs .cgva-inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  background:var(--ink);color:var(--ice);border:1px solid var(--ink-3);border-radius:999px;
  padding:8px 12px;box-shadow:0 8px 30px rgba(16,21,25,.28)}
#cgViewAs.previewing .cgva-inner{border-color:var(--chrome);box-shadow:0 0 0 2px var(--chrome-tint),0 10px 34px rgba(16,21,25,.34)}
#cgViewAs .cgva-tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--chrome);white-space:nowrap}
#cgViewAs.previewing .cgva-tag{color:var(--chrome)}
#cgViewAs .cgva-chips{display:inline-flex;gap:4px;flex-wrap:wrap}
#cgViewAs .cgva-chip{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--ice);
  background:transparent;border:1px solid var(--ink-3);border-radius:999px;padding:5px 11px;cursor:pointer;
  min-height:32px;transition:background .12s,border-color .12s}
#cgViewAs .cgva-chip:hover{border-color:var(--chrome)}
#cgViewAs .cgva-chip.on{background:var(--chrome);color:#101519;border-color:var(--chrome)}
#cgViewAs .cgva-chip:focus-visible{outline:2px solid var(--chrome);outline-offset:2px}
#cgViewAs .cgva-exit{font-family:var(--f-body);font-size:12px;font-weight:700;cursor:pointer;
  background:transparent;color:var(--ice);border:1px solid var(--chrome);border-radius:999px;padding:5px 12px;min-height:32px}
#cgViewAs .cgva-note{font-size:11px;color:var(--steel-2);white-space:nowrap}
@media(max-width:560px){#cgViewAs .cgva-note{display:none}}
@media(prefers-reduced-motion:reduce){#cgViewAs .cgva-chip{transition:none}}
/* ===== Pre-season central: command table (registrations) ===== */
.reg-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.reg-bar .seg{flex-wrap:wrap}
.reg-bar .seg .num{opacity:.6;margin-left:6px;font-size:11px;font-weight:800}
.reg-bar input[type=search]{flex:1;min-width:170px}
.reg-bar #regShowing{white-space:nowrap;margin-left:auto}
/* quiet the scouted-overall input until touched */
.scout-in{width:52px;text-align:center;padding:4px 2px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--steel);font-family:var(--f-mono);font-size:12.5px}
.scout-in:hover{border-color:var(--line)}
.scout-in:focus{border-color:var(--chrome);color:var(--ink);background:var(--ice);outline:none}
.scout-in:disabled{opacity:.4}
/* fixed, never-wrapping action cell + one-move assign cluster */
.reg-act{white-space:nowrap}
.fa-assign{display:inline-flex;gap:6px;align-items:center;flex-wrap:nowrap;justify-content:flex-end}
.fa-club{padding:5px;max-width:150px;font-size:12px}
.rm-btn:hover{color:var(--red-ink);border-color:var(--red-ink)}
/* status rail — instant read of where each row sits */
.reg-row-fa  td:first-child{box-shadow:inset 3px 0 0 var(--amber-ink)}
.reg-row-ros td:first-child{box-shadow:inset 3px 0 0 var(--green-ink)}
.reg-row-dec td:first-child{box-shadow:inset 3px 0 0 var(--steel)}
.reg-row-dec{opacity:.55}
.playercell .pc-av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none}
.playercell small.mono{display:block;color:var(--steel);font-size:10.5px;line-height:1.2}
/* per-club roster ledger (expandable) */
.club-led details{border-top:1px solid var(--line-soft)}
.club-led details:first-child{border-top:0}
.club-led summary{display:flex;align-items:center;gap:12px;padding:10px 2px;cursor:pointer;list-style:none}
.club-led summary::-webkit-details-marker{display:none}
.club-led summary::marker{content:""}
.club-led summary .chev{color:var(--steel);transition:transform .15s}
.club-led details[open] summary .chev{transform:rotate(90deg)}
.club-led .cl-players{padding:2px 2px 14px 34px;display:flex;flex-direction:column;gap:5px}
.club-led .cl-row{display:flex;align-items:center;gap:10px;font-size:13px}
.club-led .cl-row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the fill bar's sizing/colour is otherwise scoped to .rbar; give the ledger its own */
.club-led .rb-track{height:9px;border-radius:6px;background:var(--line);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.16)}
.club-led .rb-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ink),var(--steel-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
@media(prefers-reduced-motion:reduce){.club-led summary .chev{transition:none}}
/* Team HQ team-overview: the ledger stat strip */
/* eyebrow label — base rule so .rb-lab reads as a tiny mono caption outside .rbar too (seats, "Next") */
.rb-lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
.ovstat{display:flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--paper);overflow:hidden}
.ovstat .cell{flex:1 1 0;min-width:96px;padding:12px 14px;border-right:1px solid var(--line-soft)}
.ovstat .cell:last-child{border-right:0}
.ovstat .cell b{display:block;font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:-.01em;line-height:1.15}
.ovstat .cell b small{font-size:11px;font-weight:700;color:var(--steel)}
.ovstat .cell span{display:block;margin-top:3px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
</style>
